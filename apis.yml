description: 'Ludo.ai generates production-ready game assets with AI: sprites and animated sprite sheets, images,
  3D models with rigging and animation, sound effects, music, voices and video. The same asset generation is available
  from the web app, the Ludo CLI, a remote MCP server, a REST API and a Unity plugin, on one account and one set
  of credits (CLI, MCP and API on the Pro and Studio plans).'
