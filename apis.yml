    AUTH: header is Authorization (not Authentication), value 'ApiKey <key>' -- spec
    securitySchemes.ApiKey. LIMITS (spec info.description): 50 queued/running API generations per
    account (429), job-status 150 req / 5 min per key, docs search 60 / 5 min and 1000 / day, docs
