apis:
- aid: ludo-ai:mcp-server
  name: Ludo.ai MCP Server
  tags:
  - AI Assistants
  - Asset Generation
  - Game Development
  - Model Context Protocol
  - Vibe Coding
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://mcp.ludo.ai/mcp
  humanURL: https://ludo.ai/docs/api-mcp
  properties:
  - url: https://ludo.ai/docs/api-mcp
    type: Documentation
  - url: https://github.com/Ludo-AI/ludo-mcp
    type: GitHubRepository
  description: >-
    The Ludo.ai MCP Server exposes the platform's asset generation tools via the Model Context Protocol,
    allowing AI assistants like Claude and Cursor to generate game assets through natural language conversations.
    The server provides over 20 tools including createImage, editImage, animateSprite, create3DModel,
    createSoundEffect, createMusic, createVoice, and createVideo.
- aid: ludo-ai:unity-plugin
  name: Ludo.ai Unity Plugin
  tags:
  - Asset Generation
  - Game Development
  - Plugin
  - Unity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://github.com/Ludo-AI/ludo-unity-plugin
  properties:
  - url: https://github.com/Ludo-AI/ludo-unity-plugin
    type: Documentation
  description: >-
    The Ludo.ai Unity Plugin integrates AI-powered asset generation directly into the Unity game engine.
    It provides a native interface for Unity developers to access Ludo.ai's image generation, 3D model
    creation, audio production, and animation tools without leaving the editor. The plugin connects to
    the Ludo.ai API to deliver generated assets directly into Unity projects, streamlining the game development
    workflow.
