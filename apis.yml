  properties:
  - url: https://github.com/Ludo-AI/ludo-unity-plugin
    type: Documentation
  description: >-
    The Ludo.ai Unity Plugin integrates AI-powered asset generation directly into the Unity game engine.
    It provides a native interface for Unity developers to access Ludo.ai's image generation, 3D model
    creation, audio production, and animation tools without leaving the editor. The plugin connects to
    the Ludo.ai API to deliver generated assets directly into Unity projects, streamlining the game development
    workflow.
