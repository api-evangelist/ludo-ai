- breaking: false
  highlights:
  - 'Ludo now has a command line. ludo puts every Ludo generator in your terminal: sprites and spritesheet animations, images, 3D models with
    rigging and animation, video, sound effects, music and voices.'
  - npm install -g @ludoai/cli
  - Every result is saved to ./ludo-output, and in terminals that can draw images, like iTerm2, Kitty, Ghostty and WezTerm, it shows up right
    under your command.
  date: '2026-09-28'
- breaking: false
  highlights:
  - Hydra is the new default animation model in the Sprite Generator.
  - It runs at 3 credits per second, for animations from 3 to 5 seconds.
  - 'Every Hydra animation comes with audio: a sound track timed to the motion.'
  date: '2026-09-21'
- breaking: false
  highlights:
  - Your Ludo account can now ask for a second step when you sign in, so a password on its own is not the only thing between your projects and
    somebody else.
  - You can use an authenticator app, a passkey, or both together.
  - Turning on your first factor gives you ten single-use recovery codes, shown exactly once.
  date: '2026-09-01'
