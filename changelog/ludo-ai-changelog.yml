  highlights:
  - Every animation starts with a skeleton, and now any 3D model in your library can get one in a single click – no external software, no manual
    weight‑painting.
  - Pick a Joint naming convention and your bones come out named the way your engine or DCC tool expects.
  - Rigging costs just 1 credit, and you can re‑rig to save a fresh variant without losing the original.
