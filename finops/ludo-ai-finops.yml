principles:
  - name: Visibility
    description: Track credit burn against the plan allotment (GET /assets/account returns the
      balance, plan and reset time; GET /assets/generations the generation history); monitor
      queue saturation against the plan's concurrent-generation limit.
  - name: Allocation
    description: Tag generated assets by project; map projects to internal product/team for chargeback.
  - name: Optimization
    description: Prefer annual billing for the saving of up to 30%; right-size between Indie / Pro / Studio
      on credit need and whether API, MCP or CLI access is needed (Pro and up); use a top-up
      rather than upgrading mid-cycle; set a CLI spending budget (max_credits) for unattended agents.
  - name: Accountability
    description: Owners review credit burn quarterly; trigger Studio upgrade before Pro credits exhaust;
      track refund-window thresholds at renewal.
