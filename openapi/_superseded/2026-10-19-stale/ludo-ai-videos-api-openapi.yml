openapi: 3.2.0
info:
  title: Ludo Ai Videos API
  version: 0.9.10
  x-logo:
    url: /static/logo-small.png
    altText: Logo
  x-refined-note:
  - x-model-lineup differs across the merged source definitions and was not carried
  description: 'Operations tagged Videos across 2 of this provider''s published API definitions: ludo-ai-rest-api-openapi.yml, ludo-ai-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
tags:
- name: Videos
paths:
  /assets/video:
    post:
      summary: createVideo
      tags:
      - Videos
      operationId: createVideo
      x-credit-action: GENERATE_VIDEO
      security:
      - ApiKey: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateVideoPayloadPublic'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: "curl -X POST \"https://api.ludo.ai/api/assets/video\" \\\n  -H \"Authorization: ApiKey YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"image\":\"<url> OR data:image/png;base64,...\",\"prompt\":\"string\"}'"
      - lang: JavaScript
        label: JavaScript
        source: "const response = await fetch(\"https://api.ludo.ai/api/assets/video\", {\n  method: \"POST\",\n  headers: {\n    \"Authorization\": \"ApiKey YOUR_API_KEY\",\n    \"Content-Type\": \"application/json\"\n  },\n  body: JSON.stringify({\n    \"image\": \"<url> OR data:image/png;base64,...\",\n    \"prompt\": \"string\"\n  })\n});\n\nconst data = await response.json();\nconsole.log(data);"
      - lang: Python
        label: Python
        source: "import requests\n\nresponse = requests.post(\n    \"https://api.ludo.ai/api/assets/video\",\n    headers={\n        \"Authorization\": \"ApiKey YOUR_API_KEY\",\n        \"Content-Type\": \"application/json\"\n    },\n    json={\n      \"image\": \"<url> OR data:image/png;base64,...\",\n      \"prompt\": \"string\"\n    }\n)\n\nprint(response.json())"
      x-credit-description: 'This endpoint''s credit cost varies by model and duration (credits/s × seconds, rounded to 0.1; a model''s minimum charge applies when that product is lower). Available models: Griffin (1.5 credits/s, shortest duration 5s, so 7.5 credits minimum; 5s = 7.5, 6s = 9, 7s = 10.5, 8s = 12, 9s = 13.5, 10s = 15, 11s = 16.5, 12s = 18, 13s = 19.5, 14s = 21, 15s = 22.5) · Griffin HD (2 credits/s, shortest duration 5s, so 10 credits minimum; 5s = 10, 6s = 12, 7s = 14, 8s = 16, 9s = 18, 10s = 20, 11s = 22, 12s = 24, 13s = 26, 14s = 28, 15s = 30) · Blitz (1 credits/s, shortest duration 2s, so 2 credits minimum; 2s = 2, 3s = 3, 4s = 4, 5s = 5, 6s = 6, 7s = 7, 8s = 8, 9s = 9, 10s = 10, 11s = 11, 12s = 12) - LEGACY - scheduled for removal, do not use for new work · Eagle (1.3 credits/s; 1s = 1.3, 2s = 2.6, 3s = 3.9, 4s = 5.2, 5s = 6.5, 6s = 7.8, 7s = 9.1, 8s = 10.4, 9s = 11.7, 10s = 13, 11s = 14.3, 12s = 15.6, 13s = 16.9, 14s = 18.2, 15s = 19.5) - LEGACY - scheduled for removal, do not use for new work · Eagle with Audio (1.8 credits/s; 1s = 1.8, 2s = 3.6, 3s = 5.4, 4s = 7.2, 5s = 9, 6s = 10.8, 7s = 12.6, 8s = 14.4, 9s = 16.2, 10s = 18, 11s = 19.8, 12s = 21.6, 13s = 23.4, 14s = 25.2, 15s = 27) - LEGACY - scheduled for removal, do not use for new work'
      x-credit-summary: 'credits/s × seconds, per model: Griffin 1.5/s (shortest duration 5s, so 7.5 credits minimum), Griffin HD 2/s (shortest duration 5s, so 10 credits minimum), Blitz 1/s (shortest duration 2s, so 2 credits minimum) [LEGACY], Eagle 1.3/s [LEGACY], Eagle with Audio 1.8/s [LEGACY]; [LEGACY] models are scheduled for removal - do not use them for new work; see this endpoint''s full pricing table in the API docs'
      description: 'Generate a short video clip from a source image and a motion text prompt (image-to-video); a source `image` is required - to make a video from text alone, first createImage and animate that, or use createVideoFromReferences with reference images. Griffin (default, 480p) and Griffin HD (720p) both generate a soundtrack; no separate audio step is needed. The job result is the video URL and its actual duration in seconds. Optionally pass `final_image` to interpolate between a start and end frame. The chosen `model` and `duration` must be compatible (incompatible combinations return HTTP 400); see the `model` and `duration` fields for the values each model accepts. Credits are held when the job is accepted; the final charge is max(rate × produced seconds, the model''s minimum charge), never more than for the duration you requested, and the difference (or everything, if the job fails or is cancelled) is refunded. Pass an optional `request_id` to tag the result so you can locate it later via listGenerations (type video). Related tools: use `createImage` for static images, `animateSprite` for sprite-sheet animation, and listGenerations (type video) to list videos you generated earlier. Requires an API key (user scope). The call returns 202 with a job id - poll getApiJob (pass wait 30 to long-poll) honouring poll_after_ms, until status is succeeded; its result field is exactly the response documented for this operation. Synchronous responses are deprecated but still supported: pass `async: false` to block until the result is ready and receive it as the response body. Synchronous calls run on the same queue: the response carries an X-Ludo-Job-Id header, and a job still running after 15 minutes comes back as 202 with the job instead of an error. Each account may have up to 50 generations queued or running at once via the API; a request beyond that returns 429 (code PENDING_JOBS_LIMIT).


        > **Credits:** This endpoint''s credit cost varies by model and duration (credits/s × seconds, rounded to 0.1; a model''s minimum charge applies when that product is lower). Available models: Griffin (1.5 credits/s, shortest duration 5s, so 7.5 credits minimum; 5s = 7.5, 6s = 9, 7s = 10.5, 8s = 12, 9s = 13.5, 10s = 15, 11s = 16.5, 12s = 18, 13s = 19.5, 14s = 21, 15s = 22.5) · Griffin HD (2 credits/s, shortest duration 5s, so 10 credits minimum; 5s = 10, 6s = 12, 7s = 14, 8s = 16, 9s = 18, 10s = 20, 11s = 22, 12s = 24, 13s = 26, 14s = 28, 15s = 30) · Blitz (1 credits/s, shortest duration 2s, so 2 credits minimum; 2s = 2, 3s = 3, 4s = 4, 5s = 5, 6s = 6, 7s = 7, 8s = 8, 9s = 9, 10s = 10, 11s = 11, 12s = 12) - LEGACY - scheduled for removal, do not use for new work · Eagle (1.3 credits/s; 1s = 1.3, 2s = 2.6, 3s = 3.9, 4s = 5.2, 5s = 6.5, 6s = 7.8, 7s = 9.1, 8s = 10.4, 9s = 11.7, 10s = 13, 11s = 14.3, 12s = 15.6, 13s = 16.9, 14s = 18.2, 15s = 19.5) - LEGACY - scheduled for removal, do not use for new work · Eagle with Audio (1.8 credits/s; 1s = 1.8, 2s = 3.6, 3s = 5.4, 4s = 7.2, 5s = 9, 6s = 10.8, 7s = 12.6, 8s = 14.4, 9s = 16.2, 10s = 18, 11s = 19.8, 12s = 21.6, 13s = 23.4, 14s = 25.2, 15s = 27) - LEGACY - scheduled for removal, do not use for new work.'
      x-mcp-description: 'Generate a short video clip from a source image and a motion text prompt (image-to-video); a source `image` is required - to make a video from text alone, first createImage and animate that, or use createVideoFromReferences with reference images. Griffin (default, 480p) and Griffin HD (720p) both generate a soundtrack; no separate audio step is needed. The job result is the video URL and its actual duration in seconds. Optionally pass `final_image` to interpolate between a start and end frame. The chosen `model` and `duration` must be compatible (incompatible combinations return HTTP 400); see the `model` and `duration` fields for the values each model accepts. Credits are held when the job is accepted; the final charge is max(rate × produced seconds, the model''s minimum charge), never more than for the duration you requested, and the difference (or everything, if the job fails or is cancelled) is refunded. Pass an optional `request_id` to tag the result so you can locate it later via listGenerations (type video). Related tools: use `createImage` for static images, `animateSprite` for sprite-sheet animation, and listGenerations (type video) to list videos you generated earlier. Requires an API key (user scope). The call returns 202 with a job id - poll getApiJob (pass wait 30 to long-poll) honouring poll_after_ms, until status is succeeded; its result field is exactly the response documented for this operation. Synchronous responses are deprecated but still supported: pass `async: false` to block until the result is ready and receive it as the response body. Synchronous calls run on the same queue: the response carries an X-Ludo-Job-Id header, and a job still running after 15 minutes comes back as 202 with the job instead of an error. Each account may have up to 50 generations queued or running at once via the API; a request beyond that returns 429 (code PENDING_JOBS_LIMIT).


        Credits: credits/s × seconds, per model: Griffin 1.5/s (shortest duration 5s, so 7.5 credits minimum), Griffin HD 2/s (shortest duration 5s, so 10 credits minimum), Blitz 1/s (shortest duration 2s, so 2 credits minimum) [LEGACY], Eagle 1.3/s [LEGACY], Eagle with Audio 1.8/s [LEGACY]; [LEGACY] models are scheduled for removal - do not use them for new work; see this endpoint''s full pricing table in the API docs.'
