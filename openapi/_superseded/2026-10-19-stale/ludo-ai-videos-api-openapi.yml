      x-credit-description: 'This endpoint''s credit cost varies by model and duration (credits/s × seconds, rounded to 0.1; a model''s minimum charge applies when that product is lower). Available models: Griffin (2.5 credits/s, shortest duration 5s, so 12.5 credits minimum; 5s = 12.5, 6s = 15, 7s = 17.5, 8s = 20, 9s = 22.5, 10s = 25, 11s = 27.5, 12s = 30, 13s = 32.5, 14s = 35, 15s = 37.5) · Griffin HD (4 credits/s, shortest duration 5s, so 20 credits minimum; 5s = 20, 6s = 24, 7s = 28, 8s = 32, 9s = 36, 10s = 40, 11s = 44, 12s = 48, 13s = 52, 14s = 56, 15s = 60) · Eagle (1.5 credits/s; 1s = 1.5, 2s = 3, 3s = 4.5, 4s = 6, 5s = 7.5, 6s = 9, 7s = 10.5, 8s = 12, 9s = 13.5, 10s = 15, 11s = 16.5, 12s = 18, 13s = 19.5, 14s = 21, 15s = 22.5) - LEGACY - scheduled for removal, do not use for new work · Eagle with Audio (2 credits/s; 1s = 2, 2s = 4, 3s = 6, 4s = 8, 5s = 10, 6s = 12, 7s = 14, 8s = 16, 9s = 18, 10s = 20, 11s = 22, 12s = 24, 13s = 26, 14s = 28, 15s = 30) - LEGACY - scheduled for removal, do not use for new work'
      x-credit-summary: 'credits/s × seconds, per model: Griffin 2.5/s (shortest duration 5s, so 12.5 credits minimum), Griffin HD 4/s (shortest duration 5s, so 20 credits minimum), Eagle 1.5/s [LEGACY], Eagle with Audio 2/s [LEGACY]; [LEGACY] models are scheduled for removal - do not use them for new work; see this endpoint''s full pricing table in the API docs'
      description: 'Generate a video from 1-5 reference images and a text prompt (references-to-video). Unlike createVideo, which animates a single source image, this composes a new scene that borrows characters, objects, and style from the reference images. Each image can be a URL or base64. Griffin (default, 480p) and Griffin HD (720p) generate a soundtrack; note the per-second rate here is higher than createVideo''s for the same model. The job result is the video URL and its actual duration in seconds. Choose the output shape with `aspect_ratio` ("default" lets the model decide). The chosen `model` and `duration` must be compatible (incompatible combinations return HTTP 400). Credits are held when the job is accepted; the final charge is max(rate × produced seconds, the model''s minimum charge), never more than for the duration you requested, and the difference (or everything, if the job fails or is cancelled) is refunded. Pass an optional `request_id` to tag the result so you can locate it later via listGenerations (type video). Related tools: `createVideo` for image-to-video, `editVideo` to modify a generated video. Requires an API key (user scope). The call returns 202 with a job id - poll getApiJob (pass wait 30 to long-poll) honouring poll_after_ms, until status is succeeded; its result field is exactly the response documented for this operation. Synchronous responses are deprecated but still supported: pass `async: false` to block until the result is ready and receive it as the response body. Synchronous calls run on the same queue: the response carries an X-Ludo-Job-Id header, and a job still running after 15 minutes comes back as 202 with the job instead of an error. Each account may have up to 50 generations queued or running at once via the API; a request beyond that returns 429 (code PENDING_JOBS_LIMIT).


