components:
  schemas:
    Animate3DModelPayload:
      type: object
      required:
      - model
      - prompt
      properties:
        model:
          type: string
          description: The already-rigged 3D asset to animate, as a URL or base64-encoded GLB file (not
            an AI model name). Rig it first with rigModel if it has no skeleton.
          example: <url> OR data:model/gltf-binary;base64,...
        prompt:
          type: string
          description: Desired motion, e.g. "walking" or "swinging its axe".
        mode:
          type: string
          enum:
          - rot_trans
          - rot_only
          default: rot_trans
          description: 'Animation representation: rot_trans (per-bone rotation+translation, most faithful)
            or rot_only (rotation + root translation only, for retargeting).'
          example: rot_trans
        num_variants:
          type: integer
          default: 4
          minimum: 1
          maximum: 8
          description: Number of candidate animations to generate; each returned as a standalone animation-only
            GLB with an mp4 preview.
          example: 4
        loop:
          type: boolean
          default: true
          description: 'Return to the initial pose: each clip plays forward then mirrors back to the rest
            pose for a seamless loop. Best for one-way motions (crouch, punch, wave); reads oddly for
            cyclic gaits like walking.'
          example: true
        augment_prompt:
          type: boolean
          default: true
          description: Rewrite the prompt into a detailed motion caption with an LLM (recommended).
          example: true
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id
            returns the existing job instead of generating again. Also usable as the request_id filter
            of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with
            getApiJob. Set false for a synchronous response (deprecated but supported): the call then
            blocks until the result is ready.'
          example: true
    Animate3DPresetModelPayload:
      type: object
      required:
      - model
      - preset_id
      properties:
        model:
          type: string
          description: The already-rigged 3D asset, as a URL or base64-encoded GLB file (not an AI model
            name). Rig it with rigModel using rig_type humanoid_template or humanoid_template_hands first.
          example: <url> OR data:model/gltf-binary;base64,...
        preset_id:
          type: string
          description: id of an animation preset from the presets list. Only presets that expose a clip_url
            can be applied to a 3D model.
        crop_loop:
          type: boolean
          description: Trim the animation to the span that loops seamlessly. Omit to follow the preset's
            own loop flag. Ignored when no clean loop exists.
        in_place:
          type: boolean
          description: Remove the animation's net travel so the character moves on the spot (engine-driven
            locomotion). Omit to keep the preset's own travel.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id
            returns the existing job instead of generating again. Also usable as the request_id filter
            of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with
            getApiJob. Set false for a synchronous response (deprecated but supported): the call then
            blocks until the result is ready.'
          example: true
    AnimationCandidates:
      type: object
      properties:
        animations:
          type: array
          items:
            $ref: '#/components/schemas/AnimationClip'
    AnimationClip:
      type: object
      properties:
        clip_name:
          type: string
        prompt:
          type: string
        preset_id:
          type: string
          description: Set when the clip came from the preset library (retargeting) rather than a text
            prompt.
        mode:
          type: string
          enum:
          - rot_trans
          - rot_only
          example: rot_trans
        seed:
          type: integer
        glb_url:
          type: string
          example: <url>
        preview_url:
          type: string
          example: <url>
        motion:
          type: number
          format: float
        fit_rmse:
          type: number
          format: float
    Create3DModelPayload:
      type: object
      required:
      - image
      properties:
        image:
          type: string
          description: URL or base64-encoded image to convert to 3D, taken as the front view of the subject
          example: <url> OR data:image/png;base64,...
        back_image:
          type: string
          description: 'Optional URL or base64-encoded image of the SAME subject seen from behind (rotated
            180 degrees from image). The model''s back then follows it instead of being invented from
            the front view alone. It must show the same subject, at the same scale and in the same pose
            and style as image. Only a back view is supported: a side or three-quarter view here produces
            a distorted model. No extra cost.'
          example: <url> OR data:image/png;base64,...
        target_num_faces:
          type: integer
          default: 50000
          minimum: 1000
          maximum: 200000
          description: Maximum triangle count for the mesh (1000-200000)
          example: 50000
        texture_size:
          type: integer
          default: 2048
          description: Texture resolution in pixels
          enum:
          - 1024
          - 2048
          example: 2048
        texture_type:
          type: string
          default: pbr
          description: Texture type
          enum:
          - pbr
          - simple
          - none
          example: pbr
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id
            returns the existing job instead of generating again. Also usable as the request_id filter
            of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with
            getApiJob. Set false for a synchronous response (deprecated but supported): the call then
            blocks until the result is ready.'
          example: true
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        metadata:
          type: string
        error_payload:
          type: string
        intent:
          type: object
          description: Stripe intent details sent with 3D Secure (406) errors
          properties:
            id:
              type: string
            type:
              type: string
              enum:
              - payment
              - setup
              example: payment
            client_secret:
              type: string
    Model3DResult:
      type: object
      properties:
        model_url:
          type: string
          description: URL to the generated 3D model file
          example: <url>
        snapshots:
          type: array
          items:
            type: string
          description: URLs to snapshot images from different angles (useful for previews and MCP agents)
    PublicJob:
      type: object
      required:
      - id
      - task_type
      - status
      - created_at
      properties:
        id:
          type: string
        task_type:
          type: string
          description: 'The public operationId that created this job (e.g. createImage). Determines the
            shape of `result`: it is exactly the 200 response body documented for that operation.'
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - canceled
          example: queued
        request_id:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix ms
        finished_at:
          type: integer
          format: int64
        credits_charged:
          type: number
          format: float
          description: Credits this job cost you. Charged at enqueue; reported as 0 once a job fails or
            is canceled, since the charge is refunded.
        result:
          type: object
          description: Present only when status is succeeded. Same shape as the synchronous response of
            the operation named by task_type.
        error:
          $ref: '#/components/schemas/PublicJobError'
        poll_after_ms:
          type: integer
          format: int32
          description: 'Present while the job is queued or running: wait at least this many milliseconds
            before polling again. Prefer GET /assets/jobs/{id}?wait=30 (long-poll) over tight loops.'
    PublicJobError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
    Rig3DModelPayload:
      type: object
      required:
      - model
      properties:
        model:
          type: string
          description: The 3D asset to rig, as a URL or base64-encoded GLB file (not an AI model name).
          example: <url> OR data:model/gltf-binary;base64,...
        rig_type:
          type: string
          enum:
          - general
          - humanoid
          - game
          - humanoid_template
          - humanoid_template_hands
          default: general
          description: Which skeleton to build. Pick humanoid_template (or humanoid_template_hands) if
            you intend to use animate3DModelPreset later - the default general rig cannot take presets.
            general (any asset), humanoid (anime-style characters), game (classic game-character rigs),
            or the pinned humanoid templates with named joints required for the animation preset library
            - humanoid_template (22 joints) / humanoid_template_hands (52, five fingers per hand). Templates
            only suit two-armed, two-legged characters.
          example: general
        joint_naming:
          type: string
          enum:
          - smpl
          - mixamo
          - humanik
          - unreal
          - godot
          - rigify
          - vroid
          default: smpl
          description: 'Bone naming convention for the identified joints: smpl (default), mixamo (Unity''s
            humanoid auto-mapper), humanik (same names unprefixed - Maya/MotionBuilder/FBX), unreal (UE
            mannequin), godot (SkeletonProfileHumanoid), rigify (Blender) or vroid (VRM). Purely a relabel
            - the skeleton is identical.'
          example: smpl
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id
            returns the existing job instead of generating again. Also usable as the request_id filter
            of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with
            getApiJob. Set false for a synchronous response (deprecated but supported): the call then
            blocks until the result is ready.'
          example: true
    Rig3DModelResult:
      type: object
      properties:
        model_url:
          type: string
          description: URL to the rigged GLB (skeleton + skin weights baked in).
          example: <url>
        rigged:
          type: boolean
    ThreeDModelResult:
      type: object
      properties:
        model_url:
          type: string
          example: <url>
        snapshots:
          type: array
          items:
            type: string
        request_id:
          type: string
        created_at:
          type: integer
  securitySchemes:
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: |
        For accessing the API a valid API Key token must be passed in all the queries in
        the 'Authorization' header.
        The following syntax must be used in the 'Authorization' header: ApiKey xxxxxx.yyyyyyy.zzzzzz
