# Split of openapi/_original/ludo-ai-rest-api-openapi.yml by tag (3D Models).
openapi: 3.0.0
info:
  version: 0.9.10
  title: Ludo.ai 3D Models API
  description: |-
    Turn an image or text into a textured 3D model (GLB), auto-rig it and animate it from a prompt or a preset.

    Part of the Ludo.ai public API. Full spec: https://api.ludo.ai/api-documentation/openapi.json
  x-logo:
    url: https://api.ludo.ai/static/logo-small.png
    altText: Logo
  x-model-lineup: 'Current models: hydra (Hydra) - Most capable all-around model, generates audio. forge
    (Forge) - Sharper detail, simpler motion. Best for simple body shapes and short actions; may need
    a few tries. forge-pixel (Forge Pixel) - Best for low-res pixel art animations. griffin (Griffin)
    - Fast cinematic videos in any style, with audio, 480p. griffin-hd (Griffin HD) - Same as Griffin,
    but in 720p. Per action - sprite animation: hydra, forge, forge-pixel; motion transfer: hydra, forge,
    forge-pixel; spritesheet editing: hydra, forge, forge-pixel; video generation: griffin, griffin-hd;
    references to video: griffin, griffin-hd; video editing: griffin-hd. LEGACY models, still accepted
    but scheduled for removal - do not use them for new work: blitz, eagle, eagle-audio, tango.'
  contact:
    name: Ludo.ai Support
    email: support@ludo.ai
    url: https://ludo.ai/contact
  termsOfService: https://ludo.ai/terms-of-service
externalDocs:
  description: API reference
  url: https://api.ludo.ai/api-documentation
servers:
- url: https://api.ludo.ai/api
  description: Production
tags:
- name: 3D Models
paths:
  /assets/3d-model:
    post:
      summary: create3DModel
      tags:
      - 3D Models
      operationId: create3DModel
      x-credit-action: GENERATE_3D_MODEL
      security:
      - ApiKey: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create3DModelPayload'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model3DResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous
            (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl -X POST "https://api.ludo.ai/api/assets/3d-model" \
            -H "Authorization: ApiKey YOUR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"image":"<url> OR data:image/png;base64,..."}'
      - lang: JavaScript
        label: JavaScript
        source: |-
          const response = await fetch("https://api.ludo.ai/api/assets/3d-model", {
            method: "POST",
            headers: {
              "Authorization": "ApiKey YOUR_API_KEY",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              "image": "<url> OR data:image/png;base64,..."
            })
          });

          const data = await response.json();
          console.log(data);
      - lang: Python
        label: Python
        source: |-
          import requests

          response = requests.post(
              "https://api.ludo.ai/api/assets/3d-model",
              headers={
                  "Authorization": "ApiKey YOUR_API_KEY",
                  "Content-Type": "application/json"
              },
              json={
                "image": "<url> OR data:image/png;base64,..."
              }
          )

          print(response.json())
      x-credit-description: This endpoint consumes 3 credits per call
      x-credit-summary: This endpoint consumes 3 credits per call
      description: |-
        Convert a source image into a textured 3D model (image-to-3D). The job result is a downloadable GLB model_url plus an array of snapshot image URLs rendered from different angles (handy for previews). image is the front view; pass an optional back_image (the same subject seen from behind) so the back of the model follows it instead of being invented. Accepts optional mesh controls: target_num_faces (max triangle count, 1000-200000, default 50000), texture_size (1024 or 2048, default 2048), and texture_type ("pbr", "simple", or "none", default "pbr"). Credits are held when the job is accepted and refunded if it fails or is cancelled. Pass an optional request_id to tag the result so you can locate it later via listGenerations (type 3d). Requires an API key (user scope). The call returns 202 with a job id - poll getApiJob (pass wait 30 to long-poll) honouring poll_after_ms, until status is succeeded; its result field is exactly the response documented for this operation. Synchronous responses are deprecated but still supported: pass `async: false` to block until the result is ready and receive it as the response body. Synchronous calls run on the same queue: the response carries an X-Ludo-Job-Id header, and a job still running after 15 minutes comes back as 202 with the job instead of an error. Each account may have up to 50 generations queued or running at once via the API; a request beyond that returns 429 (code PENDING_JOBS_LIMIT).

        > **Credits:** This endpoint consumes 3 credits per call.
