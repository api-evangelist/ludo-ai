openapi: 3.2.0
info:
  title: Ludo Ai 3D Models API
  x-refined-note:
  - x-refined-note differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged 3D Models across 2 of this provider''s published API definitions: ludo-ai-openapi.json, ludo-ai-3d-models-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
- url: https://api.ludo.ai/api
  description: Production Server
tags:
- name: 3D Models
paths:
  /assets/3d-model:
    post:
      summary: Convert a source image into a textured 3D model (image-to-3D).
      tags:
      - 3D Models
      operationId: create3DModel
      x-credit-action: GENERATE_3D_MODEL
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model3DResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create3DModelPayload'
        required: true
    servers:
    - url: /api
  /assets/3d-model/image:
    post:
      summary: Make a character image ready to turn into a 3D model, the first step of…
      tags:
      - 3D Models
      operationId: create3DModelImage
      x-credit-action: GENERATE_IMAGE
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create3DModelImagePayload'
        required: true
    servers:
    - url: /api
  /assets/3d-model/rig:
    post:
      summary: 'Rig a 3D model: generate a skeleton and skin weights for an existing GLB so it…'
      tags:
      - 3D Models
      operationId: rigModel
      x-credit-action: RIG_3D_MODEL
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rig3DModelResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rig3DModelPayload'
        required: true
    servers:
    - url: /api
  /assets/3d-model/animate:
    post:
      summary: Generate text-driven skeletal animations for an already-rigged 3D model.
      tags:
      - 3D Models
      operationId: animate3DModel
      x-credit-action: ANIMATE_3D_MODEL
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimationCandidates'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Animate3DModelPayload'
        required: true
    servers:
    - url: /api
  /assets/3d-model/animate-preset:
    post:
      summary: Apply a curated animation preset to an already-rigged 3D model (retargeting).
      tags:
      - 3D Models
      operationId: animate3DModelPreset
      x-credit-action: ANIMATE_3D_PRESET
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimationCandidates'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Animate3DPresetModelPayload'
        required: true
    servers:
    - url: /api
  /assets/3d-models/results:
    get:
      description: '**Deprecated:** prefer `GET /assets/generations` (all types, paginated, same source filter). This endpoint continues to work; no removal is scheduled.

        List 3D models you previously generated through the API, most recent first. This is a free read-only history lookup (no credits, no generation); it does not create anything. Pass an optional request_id query parameter to return only the results tagged with that id when you originally called create3DModel. Requires an API key (user scope).'
      tags:
      - 3D Models
      operationId: get3DModelResults
      deprecated: true
      x-mcp-exclude: true
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      parameters:
      - name: request_id
        in: query
        description: Filter results by request_id
        required: false
        schema:
          type: string
      - name: source
        in: query
        description: 'Which surface the results were generated from: api (default, your API/MCP generations from the last 7 days), web (your Ludo web studio generations, no time limit), or all'
        required: false
        schema:
          type: string
          enum:
          - api
          - web
          - all
          default: api
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThreeDModelResult'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get3 DModel results
      x-summary-source: derived
    servers:
    - url: /api
  /3d-models/create:
    servers:
    - url: https://api.ludo.ai/api
      description: Production Server
    post:
      operationId: post3dModelsCreate
      summary: Ludo.ai Convert a 2D image to a 3D model
      description: Convert a 2D image into a textured 3D GLB model with configurable PBR textures, polygon count, and texture resolution. Processing takes 60 to 120 seconds. Returns the GLB model URL and four snapshot images from different angles. Costs 3 credits per model.
      tags:
      - 3D Models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create3DModelRequest'
      responses:
        '200':
          description: Successfully created 3D model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model3DResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiKeyAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: create3DModel
components:
  schemas:
    Animate3DModelPayload:
      type: object
      required:
      - model
      - prompt
      properties:
        model:
          type: string
          description: The already-rigged 3D asset to animate, as a URL or base64-encoded GLB file (not an AI model name). Rig it first with rigModel if it has no skeleton.
        prompt:
          type: string
          description: Desired motion, e.g. "walking" or "swinging its axe".
        mode:
          type: string
          enum:
          - rot_trans
          - rot_only
          default: rot_trans
          description: 'Animation representation: rot_trans (per-bone rotation+translation, most faithful) or rot_only (rotation + root translation only, for retargeting).'
        num_variants:
          type: integer
          default: 4
          minimum: 1
          maximum: 8
          description: Number of candidate animations to generate; each returned as a standalone animation-only GLB with an mp4 preview.
        loop:
          type: boolean
          default: true
          description: 'Return to the initial pose: each clip plays forward then mirrors back to the rest pose for a seamless loop. Best for one-way motions (crouch, punch, wave); reads oddly for cyclic gaits like walking.'
        augment_prompt:
          type: boolean
          default: true
          description: Rewrites the prompt into a detailed motion caption with an LLM. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    Animate3DPresetModelPayload:
      type: object
      required:
      - model
      - preset_id
      properties:
        model:
          type: string
          description: The already-rigged 3D asset, as a URL or base64-encoded GLB file (not an AI model name). Rig it first, with rigModel or with create3DModel's rig (any rig type).
        preset_id:
          type: string
          description: id of an animation preset from listAnimationPresets. Any preset id from that list works.
        crop_loop:
          type: boolean
          description: Trim the animation to the span that loops seamlessly. Omit to follow the preset's own loop flag. Ignored when no clean loop exists.
        in_place:
          type: boolean
          description: Remove the animation's net travel so the character moves on the spot (engine-driven locomotion). Omit to keep the preset's own travel.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    PublicJobError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
    ThreeDModelResult:
      type: object
      properties:
        model_url:
          type: string
        snapshots:
          type: array
          items:
            type: string
        request_id:
          type: string
        created_at:
          type: integer
    Rig3DModelPayload:
      type: object
      required:
      - model
      properties:
        model:
          type: string
          description: The 3D asset to rig, as a URL or base64-encoded GLB file (not an AI model name).
        rig_type:
          type: string
          enum:
          - general
          - humanoid
          - game
          - humanoid_template
          - humanoid_template_hands
          default: general
          description: 'Which skeleton to build: general (default, any asset), humanoid (anime-style characters), game (classic game-character rigs), or the pinned humanoid templates with named joints - humanoid_template (22 joints) / humanoid_template_hands (52, five fingers per hand). Templates only suit two-armed, two-legged characters. Animation presets (animate3DModelPreset) retarget onto any rig type, though not onto every model.'
        joint_naming:
          type: string
          enum:
          - smpl
          - mixamo
          - humanik
          - unreal
          - godot
          - rigify
          - vroid
          default: smpl
          description: 'Bone naming convention for the identified joints: smpl (default), mixamo (Unity''s humanoid auto-mapper), humanik (same names unprefixed - Maya/MotionBuilder/FBX), unreal (UE mannequin), godot (SkeletonProfileHumanoid), rigify (Blender) or vroid (VRM). Purely a relabel - the skeleton is identical.'
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    Create3DModelPayload:
      type: object
      required:
      - image
      properties:
        image:
          type: string
          description: URL or base64-encoded image to convert to 3D, taken as the front view of the subject
        model:
          type: string
          default: prop
          description: 'Image-to-3D model: prop (default) or hero. The public specs rewrite this from THREE_D_MODELS in credits.js (scripts/generate-public-swagger.js).'
          enum:
          - prop
          - hero
        back_image:
          type: string
          description: 'Optional URL or base64-encoded image of the SAME subject seen from behind (rotated 180 degrees from image). The model''s back then follows it instead of being invented from the front view alone. It must show the same subject, at the same scale and in the same pose and style as image. Only a back view is supported: a side or three-quarter view here produces a distorted model. Prop model only: hero rejects it with HTTP 400. No extra cost.'
        target_num_faces:
          type: integer
          default: 50000
          minimum: 1000
          maximum: 200000
          description: Maximum triangle count for the mesh (1000-200000)
        texture_size:
          type: integer
          default: 2048
          description: Texture resolution in pixels
          enum:
          - 1024
          - 2048
        texture_type:
          type: string
          default: pbr
          description: Texture type
          enum:
          - pbr
          - simple
          - none
        rig:
          type: boolean
          default: false
          description: Also rig the model (skeleton and skin weights) in the same call, so it can be animated or rendered with createDirectionalSprites. It gets the general rig, which suits any shape; there is no rig type to pick here (rigModel offers the others). Adds the rigModel price, charged only when the model comes back rigged (the result's rigged).
        joint_naming:
          type: string
          enum:
          - smpl
          - mixamo
          - humanik
          - unreal
          - godot
          - rigify
          - vroid
          default: smpl
          description: With rig, the bone naming convention (as rigModel's joint_naming). Purely a relabel - the skeleton is identical.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        metadata:
          type: string
        error_payload:
          type: string
        intent:
          type: object
          description: Stripe intent details sent with 3D Secure (406) errors
          properties:
            id:
              type: string
            type:
              type: string
              enum:
              - payment
              - setup
            client_secret:
              type: string
    Rig3DModelResult:
      type: object
      properties:
        model_url:
          type: string
          description: URL to the rigged GLB (skeleton + skin weights baked in).
        rigged:
          type: boolean
    AnimationClip:
      type: object
      properties:
        clip_name:
          type: string
        prompt:
          type: string
        preset_id:
          type: string
          description: Set when the clip came from the preset library (retargeting) rather than a text prompt.
        mode:
          type: string
          enum:
          - rot_trans
          - rot_only
        seed:
          type: integer
        glb_url:
          type: string
        preview_url:
          type: string
        motion:
          type: number
          format: float
        fit_rmse:
          type: number
          format: float
    Create3DModelImagePayload:
      type: object
      description: Payload for making a character image ready for create3DModel. Pass a prompt, an image, or both.
      properties:
        prompt:
          type: string
          maxLength: 1000
          description: Without an image, a description of the character (e.g. "a knight in green armour, full body, standing"). With an image, the changes to make while redrawing it (e.g. "add a red cape and a sword"); optional.
        image:
          type: string
          description: Optional URL or base64-encoded image of your own, redrawn as a 3D render.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    AnimationCandidates:
      type: object
      properties:
        animations:
          type: array
          items:
            $ref: '#/components/schemas/AnimationClip'
    Model3DResult:
      type: object
      properties:
        model_url:
          type: string
          description: URL to the generated 3D model file
        snapshots:
          type: array
          items:
            type: string
          description: URLs to snapshot images from different angles (useful for previews and MCP agents)
        rigged:
          type: boolean
          description: True when the model carries a skeleton (asked for with rig).
    ImageResult:
      type: object
      properties:
        url:
          type: string
        request_id:
          type: string
        created_at:
          type: integer
    PublicJob:
      type: object
      required:
      - id
      - task_type
      - status
      - created_at
      properties:
        id:
          type: string
        task_type:
          type: string
          description: 'The public operationId that created this job (e.g. createImage). Determines the shape of `result`: it is exactly the 200 response body documented for that operation.'
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - canceled
        request_id:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix ms
        finished_at:
          type: integer
          format: int64
        credits_charged:
          type: number
          format: float
          description: Credits this job cost you. Charged at enqueue; reported as 0 once a job fails or is canceled, since the charge is refunded.
        result:
          type: object
          description: Present only when status is succeeded. Same shape as the synchronous response of the operation named by task_type.
        error:
          $ref: '#/components/schemas/PublicJobError'
        poll_after_ms:
          type: integer
          format: int32
          description: 'Present while the job is queued or running: wait at least this many milliseconds before polling again. Prefer GET /assets/jobs/{id}?wait=30 (long-poll) over tight loops.'
    Create3DModelRequest:
      type: object
      required:
      - image
      properties:
        image:
          type: string
          description: URL or base64-encoded 2D image to convert to a 3D model.
        texture_type:
          type: string
          description: Type of texture to apply to the 3D model.
          enum:
          - pbr
          - simple
          - none
          default: pbr
        texture_size:
          type: integer
          description: Texture resolution in pixels.
          enum:
          - 1024
          - 2048
          - 4096
          default: 2048
        target_num_faces:
          type: integer
          description: Target triangle count for the 3D model mesh.
          minimum: 1000
          maximum: 100000
          default: 50000
        high_detail_shape:
          type: boolean
          description: Enable for complex shapes that require more detail. Results in slower processing.
        request_id:
          type: string
          description: Client-provided ID to retrieve results later via the results endpoint.
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong.
        code:
          type: string
          description: Machine-readable error code.
    Model3DResponse:
      type: object
      properties:
        model_url:
          type: string
          format: uri
          description: URL of the generated GLB 3D model file. Expires after 7 days.
        snapshots:
          type: array
          description: Four snapshot images of the 3D model from different angles.
          items:
            type: string
            format: uri
          minItems: 4
          maxItems: 4
        request_id:
          type: string
          description: The request ID if one was provided.
  securitySchemes:
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: 'For accessing the API a valid API Key token must be passed in all the queries in

        the ''Authorization'' header.

        The following syntax must be used in the ''Authorization'' header: ApiKey xxxxxx.yyyyyyy.zzzzzz

        '
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: 'For accessing the API a valid JWT token must be passed in all the queries in

        the ''Authorization'' header.

        A valid JWT token is generated by the API and retourned as answer of a call

        to the route /login giving a valid user & password.

        The following syntax must be used in the ''Authorization'' header: Bearer xxxxxx.yyyyyyy.zzzzzz

        '
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authentication
      description: 'API key authentication. Pass your API key in the Authentication header with the format: ApiKey YOUR_API_KEY'
externalDocs:
  description: Ludo.ai API Documentation
  url: https://api.ludo.ai/api-documentation
x-refined-from:
- ludo-ai-openapi.json
- ludo-ai-3d-models-api-openapi.yml
