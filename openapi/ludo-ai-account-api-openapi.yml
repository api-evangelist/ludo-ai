openapi: 3.2.0
info:
  version: 0.9.10
  title: Ludo.ai Account API
servers:
- url: /api
tags:
- name: Account
paths:
  /assets/account:
    get:
      description: Show your account's credit balance, plan and auto top-up settings. `credits.available` is what generations can spend right now (plan_credits + extra - used); `resets_at` is when the plan's monthly credits refill (unix seconds). When `team_pool` is true the balance is your team's shared pool, and `auto_topup` is null because the team owner manages it. Check this before an expensive generation instead of waiting for a 402. Buying credits and changing auto top-up happen in the web app at `billing_url`. This is a free read-only lookup (no credits, no generation). Requires an API key (user scope).
      tags:
      - Account
      operationId: getAccount
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get account
      x-summary-source: derived
  /assets/cli-key:
    delete:
      description: Revoke the key making this call, when it was created by a browser login. Other API keys are managed in the web app. Free. Requires an API key (user scope).
      tags:
      - Account
      operationId: revokeCurrentCliKey
      x-mcp-exclude: true
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Not a browser-login key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Revoke current cli key
      x-summary-source: derived
  /assets/feedback:
    post:
      description: 'Report a problem with the Ludo API itself to the Ludo team. Use it ONLY for API bugs (an error, a failed or stuck job, a crash, a response that does not match this documentation) and API limitations (a parameter, operation or format you needed that the API does not support, and that you could not work around). NEVER use it to report model limitations or the quality of a result: an image, sprite, animation, 3D model, video or sound that looks wrong, ignores part of the prompt, has artifacts or is not what you wanted is not an API bug. Do not report those; retry with a different prompt, model or settings instead. Before reporting a limitation, call searchDocs with what you tried: if the docs already describe it as a known limitation, do not report it. Describe what you were trying to do and what went wrong, and name the operation it relates to. Always send the id of every job the report is about, in job_ids (up to 10): we look at those jobs'' inputs and outputs, and a report about a result we cannot find cannot be investigated. Do not include personal data, secrets or file contents. Send one report per issue, and if you are an agent, tell the user what you sent. Free (no credits). Requires an API key (user scope).'
      tags:
      - Account
      operationId: submitApiFeedback
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFeedbackReceipt'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiFeedbackPayload'
        required: true
      summary: Submit api feedback
      x-summary-source: derived
components:
  schemas:
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
    ApiFeedbackPayload:
      type: object
      required:
      - category
      - message
      properties:
        category:
          type: string
          enum:
          - limitation
          - bug
          - feature_request
          - praise
          - other
          description: 'bug - the API errored, a job failed or got stuck, or a response did not match the documentation; limitation - the API does not support a parameter, operation or format you needed; feature_request - a new API capability you would like; praise - something that worked well; other - any other API issue. Generated content that looks wrong or does not match the prompt is a model limitation, not a bug: do not report it. A limitation the docs already describe (check with searchDocs) is known: do not report it.'
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: What you were trying to do, what happened, and what would have helped.
        operation:
          type: string
          maxLength: 100
          description: The operation the feedback is about, e.g. animateSprite.
        job_id:
          type: string
          maxLength: 64
          description: The id of the job the feedback is about. Same as a one-item job_ids.
        job_ids:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
          description: 'The ids of the jobs the feedback is about (returned by each generation call; also in getApiJob and listApiJobs). Send them whenever a job is involved: every job that shows the problem, plus the one that worked if you are comparing.'
        agent:
          type: string
          maxLength: 100
          description: The agent or app sending it, e.g. Claude Code.
    ApiFeedbackReceipt:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        metadata:
          type: string
        error_payload:
          type: string
        intent:
          type: object
          description: Stripe intent details sent with 3D Secure (406) errors
          properties:
            id:
              type: string
            type:
              type: string
              enum:
              - payment
              - setup
            client_secret:
              type: string
    AccountInfo:
      type: object
      properties:
        credits:
          type: object
          properties:
            available:
              type: number
              format: float
              description: Credits generations can spend right now.
            plan_credits:
              type: number
              format: float
              description: The plan's credits for the current cycle.
            used:
              type: number
              format: float
              description: Plan credits used this cycle.
            extra:
              type: number
              format: float
              description: Credits from top-ups and grants, on top of the plan.
            resets_at:
              type: integer
              format: int64
              description: When the plan credits refill (unix seconds).
            team_pool:
              type: boolean
              description: The balance is a team's shared pool.
            paused:
              type: boolean
            grace_until:
              type: integer
              format: int64
              description: Set when the subscription ended; remaining credits stay spendable until then (unix seconds).
        plan:
          type: object
          properties:
            name:
              type: string
            api_access:
              type: boolean
        auto_topup:
          type: object
          description: Null for team members; the team owner manages auto top-up.
          properties:
            enabled:
              type: boolean
            threshold:
              type: number
              format: float
              description: An automatic top-up is bought when available credits drop below this.
            credits:
              type: integer
              description: Credits bought on each automatic top-up.
        billing_url:
          type: string
          description: Web page to buy credits, change plan or change auto top-up.
  securitySchemes:
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: 'For accessing the API a valid API Key token must be passed in all the queries in

        the ''Authorization'' header.

        The following syntax must be used in the ''Authorization'' header: ApiKey xxxxxx.yyyyyyy.zzzzzz

        '
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: 'For accessing the API a valid JWT token must be passed in all the queries in

        the ''Authorization'' header.

        A valid JWT token is generated by the API and retourned as answer of a call

        to the route /login giving a valid user & password.

        The following syntax must be used in the ''Authorization'' header: Bearer xxxxxx.yyyyyyy.zzzzzz

        '
x-provenance:
  method: harvested
  publisher: Ludo.ai
  source: https://api.ludo.ai/api-docs
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
