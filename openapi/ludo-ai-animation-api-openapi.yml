          enum:
          - 4
          - 9
          - 16
          - 25
          - 36
          - 49
          - 64
        frame_size:
          type: number
          format: integer
          description: Size of each frame in pixels (width and height). 0 is for maximum resolution. Omit
            to keep the source spritesheet's frame size.
          enum:
          - 32
          - 64
          - 96
          - 128
          - 192
          - 256
          - 384
          - 0
        gif:
          type: boolean
          default: false
          description: When true, generates an animated GIF from the spritesheet and returns it in gif_url.
            Disabled by default to reduce response time.
          example: false
        individual_frames:
          type: boolean
          default: false
          description: When true, extracts each frame from the spritesheet as an individual image and
            returns the URLs in individual_frame_urls.
          example: false
        spritesheet_with_background:
          type: boolean
          default: false
          description: When true, also returns the spritesheet with background intact (before background
            removal). The with-background spritesheet URL will be in spritesheet_with_background_url.
          example: false
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id
            returns the existing job instead of generating again. Also usable as the request_id filter
            of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with
            getApiJob. Set false for a synchronous response (deprecated but supported): the call then
            blocks until the result is ready.'
          example: true
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        metadata:
          type: string
        error_payload:
          type: string
        intent:
          type: object
          description: Stripe intent details sent with 3D Secure (406) errors
          properties:
            id:
              type: string
            type:
              type: string
              enum:
              - payment
              - setup
              example: payment
            client_secret:
              type: string
    GeneratePosePayload:
      type: object
      description: Payload for generating a new pose for an existing sprite
      required:
      - image
      - pose
      properties:
        image:
          type: string
          description: URL or base64-encoded source sprite image to generate a new pose from.
          example: <url> OR data:image/png;base64,...
        pose:
          type: string
          description: Target pose for the sprite. Use the value "Other" to generate other poses not listed
            in the accepted values, and fill the field description accordingly.
          enum:
          - Idle (Front)
          - Idle (Back)
          - Idle (Left Facing)
          - Idle (Right Facing)
          - Walk (Left)
          - Walk (Right)
          - Walk (Towards the camera)
          - Walk (Away from the camera)
          - Run (Left)
          - Run (Right)
          - Run (Towards the camera)
          - Run (Away from the camera)
          - Crouching
          - Crawling
          - Sitting
          - Defending / Blocking
          - Attack Ready
          - Jump Preparation
          - Sleeping
          - Flying
          - Other
          example: Idle (Front)
        description:
          type: string
          description: Optional additional instructions or description to guide the pose generation.
        n:
          type: number
          format: integer
          description: Number of pose variations to generate (1-4).
          minimum: 1
          maximum: 4
          default: 1
          example: 1
        augment_prompt:
          type: boolean
          default: true
          description: Augment the prompt behind the scenes. Disable to have more control.
          example: true
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id
            returns the existing job instead of generating again. Also usable as the request_id filter
            of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with
            getApiJob. Set false for a synchronous response (deprecated but supported): the call then
            blocks until the result is ready.'
          example: true
    PoseResult:
      type: object
      description: Result of a pose generation
      properties:
        url:
          type: string
          description: URL of the generated pose image
          example: <url>
        pose:
          type: string
          description: The pose that was used to generate this image
        description:
          type: string
          description: The pose description that was used to generate this image
        motion_prompt:
          type: string
          description: A suggested motion prompt optimized for this pose. Can be used directly with 'animateSprite'
            for best animation results.
    PublicJob:
      type: object
      required:
      - id
      - task_type
      - status
      - created_at
      properties:
        id:
          type: string
        task_type:
          type: string
          description: 'The public operationId that created this job (e.g. createImage). Determines the
            shape of `result`: it is exactly the 200 response body documented for that operation.'
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - canceled
          example: queued
        request_id:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix ms
        finished_at:
          type: integer
          format: int64
        credits_charged:
          type: number
          format: float
          description: Credits this job cost you. Charged at enqueue; reported as 0 once a job fails or
            is canceled, since the charge is refunded.
        result:
          type: object
          description: Present only when status is succeeded. Same shape as the synchronous response of
            the operation named by task_type.
        error:
          $ref: '#/components/schemas/PublicJobError'
        poll_after_ms:
          type: integer
          format: int32
          description: 'Present while the job is queued or running: wait at least this many milliseconds
            before polling again. Prefer GET /assets/jobs/{id}?wait=30 (long-poll) over tight loops.'
    PublicJobError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
    RotateSpritePayload:
      type: object
      description: Payload for rotating the camera view of an existing sprite
      required:
      - image
      - camera_rotation
      properties:
        image:
          type: string
          description: URL or base64-encoded source sprite image to rotate.
          example: <url> OR data:image/png;base64,...
        camera_rotation:
          type: integer
          enum:
          - 0
          - 45
          - 90
          - 135
          - 180
          - -135
          - -90
          - -45
          description: Camera azimuth angle in degrees. 0 = front, 45 = front-right, 90 = right side,
            135 = back-right, 180 = back, -135 = back-left, -90 = left side, -45 = front-left.
          example: 0
        camera_elevation:
          type: integer
          enum:
          - 0
          - 30
          - 60
          description: Optional camera elevation/tilt in degrees. 0 = eye-level, 30 = elevated, 60 = high-angle.
            Omit to keep the sprite's current elevation.
          example: 0
        n:
          type: number
          format: integer
          description: Number of variations to generate (1-4).
          minimum: 1
          maximum: 4
          default: 1
          example: 1
        augment_prompt:
          type: boolean
          default: true
          description: Augment the prompt behind the scenes. Disable to have more control.
          example: true
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id
            returns the existing job instead of generating again. Also usable as the request_id filter
            of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with
            getApiJob. Set false for a synchronous response (deprecated but supported): the call then
            blocks until the result is ready.'
          example: true
    RotateSpriteResult:
      type: object
      description: Result of a sprite camera rotation
      properties:
        url:
          type: string
          description: URL of the generated image
          example: <url>
        camera_rotation:
          type: integer
          description: The camera azimuth angle that was applied
        camera_elevation:
          type: integer
          description: The camera elevation that was applied, if any
    SpriteResult:
      type: object
      properties:
        spritesheet_url:
          type: string
          example: <url>
        video_url:
          type: string
          example: <url>
        audio_url:
          type: string
          description: URL of the sound effect generated for the animation (mp3). hydra only; absent for
            forge and forge-pixel.
          example: <url>
        gif_url:
          type: string
          example: <url>
        individual_frame_urls:
          type: array
          items:
            type: string
            example: <url>
        num_frames:
          type: integer
          description: Number of frames in the spritesheet.
        num_cols:
          type: integer
          description: Columns in the frame grid. Frames run left-to-right, top-to-bottom.
        num_rows:
          type: integer
          description: Rows in the frame grid. The last row may be only partly filled.
        spritesheet_with_background_url:
          type: string
          example: <url>
        individual_frame_with_background_urls:
          type: array
          items:
            type: string
            example: <url>
        duration:
          type: number
          format: float
        request_id:
          type: string
        created_at:
          type: integer
    TransferMotionPayload:
      type: object
      description: Payload for transferring motion from a video onto a static sprite image, producing
        an animated spritesheet.
      required:
      - image
      properties:
        image:
          type: string
          description: The static sprite to animate, as a URL or base64 image. Ideally an image generated
            with the "sprite", "sprite-vfx" or "ui_asset" image type.
          example: <url> OR data:image/png;base64,...
        video:
          type: string
          description: URL of the video to use as motion source - the `video_url` of a spritesheet from
            animateSprite, or your own clip. Videos up to 4 seconds work best. Either `video` or `preset_id`
            + `perspective` + `direction` must be provided; when both are sent the video is used.
        preset_id:
          type: string
          description: ID of an animation preset to use instead of a video URL. Use listAnimationPresets
            to list available presets. When using a preset, `perspective` and `direction` are required.
        direction:
          type: string
          description: Direction for the animation preset. When using a preset, `direction` is required.
          enum:
          - N
          - NE
          - E
          - SE
          - S
          - SW
          - W
          - NW
          example: N
        perspective:
          type: string
          description: 'Camera perspective of the preset clip, by id (the `perspectives` list of listAnimationPresets,
            the same set for every preset): high = tactical steep top-down, horizon = side view at eye
            level, isometric = diagonal top-down with depth, low = hero low angle, top = directly overhead.
            Required when using a preset. Unrelated to the `perspective` of createImage, which is a free-text
            art direction.'
          enum:
          - high
          - horizon
          - isometric
          - low
          - top
          example: high
        frames:
          type: number
          format: integer
          description: Number of frames in the output spritesheet.
          default: 36
          enum:
          - 4
          - 9
          - 16
          - 25
          - 36
          - 49
          - 64
          example: 36
        frame_size:
          type: number
          format: integer
          description: Size of each frame in pixels (width and height). 0 is for maximum resolution.
          default: 0
          enum:
          - 32
          - 64
          - 96
          - 128
          - 192
          - 256
          - 384
          - 0
          example: 0
        loop:
          type: boolean
          default: true
          description: Trim the animation at the beginning or end to create a seamless loop.
          example: true
        crop:
          type: boolean
          default: true
          description: Crop sprite frames to fit content. Results in smaller spritesheets but inconsistent
            frame sizes across different animations.
          example: true
        margin_ratio:
          type: number
          format: float
          description: 'Deprecated: prefer margin_ratio_horizontal / margin_ratio_vertical. Amount of
            padding around the sprite as a ratio (0.0 to 1.0). Sets both axes to this value. A per-axis
            value, when also given, overrides this for that axis. Defaults to 0.15 when no margin value
            is given at all.'
          deprecated: true
        margin_ratio_horizontal:
          type: number
          format: float
          description: Horizontal padding around the sprite as a ratio (0.0 to 1.0). Useful for animations
            that extend sideways (e.g., sword slashes, punches). Overrides the legacy margin_ratio on
            this axis.
        margin_ratio_vertical:
          type: number
          format: float
          description: Vertical padding around the sprite as a ratio (0.0 to 1.0). Useful for animations
            that extend up or down (e.g., jumps). Overrides the legacy margin_ratio on this axis.
        margin_ratio_mode:
          type: string
          description: Controls how margins are applied around the sprite. Defaults to "manual". Sending
            "none" explicitly together with a margin value fails with HTTP 400 (the value would be ignored).
          enum:
          - manual
          - none
          default: manual
          example: manual
        gif:
          type: boolean
          default: false
          description: When true, generates an animated GIF from the spritesheet and returns it in gif_url.
            Disabled by default to reduce response time.
          example: false
        individual_frames:
          type: boolean
          default: false
          description: When true, extracts each frame from the spritesheet as an individual image and
            returns the URLs in individual_frame_urls.
          example: false
        spritesheet_with_background:
          type: boolean
          default: false
          description: When true, also returns the spritesheet with background intact (before background
            removal). Useful for manually fixing background removal issues. The with-background spritesheet
            URL will be in spritesheet_with_background_url.
          example: false
        model:
          type: string
          description: |-
            Model to use. Available models:
            - "hydra" (Hydra): 3 credits/s, shortest duration 3s, so 9 credits minimum · Most capable all-around model, generates audio
            - "forge" (Forge): 2 credits/s, min charge 4 credits · Sharper detail, simpler motion. Best for simple body shapes and short actions; may need a few tries
            - "forge-pixel" (Forge Pixel): 2 credits/s, min charge 4 credits · Best for low-res pixel art animations
            - "tango" (Tango): 4 credits/s, min charge 4 credits · LEGACY - scheduled for removal, do not use for new work
            Models marked LEGACY still work for existing integrations but will be removed; pick a current model for anything new.
          enum:
          - hydra
          - forge
          - forge-pixel
          - tango
          default: hydra
          example: hydra
        prompt:
          type: string
          description: Optional extra instructions for the motion transfer (e.g. "keep the cape still"),
            added to the model's own prompt.
        duration:
          type: number
          format: float
          default: 1.5
          description: |-
            Duration in seconds. If the reference video is longer, it will be compressed to this duration. Available values depend on the model:
            - hydra: 3, 3.5, 4, 4.5, 5
            - forge: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5
            - forge-pixel: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5
            - tango: 1, 1.5, 2, 2.5, 3, 3.5, 4
          example: 1.5
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id
            returns the existing job instead of generating again. Also usable as the request_id filter
            of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with
            getApiJob. Set false for a synchronous response (deprecated but supported): the call then
            blocks until the result is ready.'
          example: true
  securitySchemes:
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: |
        For accessing the API a valid API Key token must be passed in all the queries in
        the 'Authorization' header.
        The following syntax must be used in the 'Authorization' header: ApiKey xxxxxx.yyyyyyy.zzzzzz
