        = 4, 2s = 6.2, 3s = 9.3, 4s = 12.4) - LEGACY - scheduled for removal, do not use for new work'
      x-credit-summary: 'credits/s × seconds, per model: Hydra 3/s (shortest duration 3s, so 9 credits
        minimum), Forge 1.5/s (min charge 4 credits), Forge Pixel 1.5/s (min charge 4 credits), Blitz
        1.9/s (min charge 4 credits) [LEGACY], Eagle 2.6/s (min charge 4 credits) [LEGACY], Eagle with
        Audio 3.1/s (min charge 4 credits) [LEGACY]; [LEGACY] models are scheduled for removal - do not
        use them for new work; see this endpoint''s full pricing table in the API docs'
      description: |-
        Animate a static sprite into a spritesheet driven by a motion text prompt (image-to-spritesheet): supply an initial_image (URL or base64) plus a motion_prompt like "walking" or "attack slash", and optionally a final_image to interpolate between a start and end frame. Describe the motion exactly and unambiguously, but do not over-describe it: an action the model already knows is one phrase, not a sequence of steps, and the character, art style, background and camera come from the image, not the prompt. For animations driven by up to three keyframes (including a middle frame), use animateSpriteKeyframes instead. The job result is a single sprite result: `spritesheet_url` (the sheet image), `video_url` (an mp4 of the animation - pass it as `video` to transferMotion or as `spritesheet_video_url` to createSpriteAudio; editSpritesheet takes `spritesheet_url`), `num_frames`/`num_cols`/`num_rows` (the grid layout), and, when requested, `gif_url`, `individual_frame_urls` and `spritesheet_with_background_url`. The hydra model also returns `audio_url`, a sound effect for the animation - there is no need to call createSpriteAudio afterwards; forge and forge-pixel produce no audio. The chosen model must support sprite animation and the duration must be valid for it; incompatible model/duration combinations return HTTP 400. Credits are held when the job is accepted and the charge is for the duration you requested (rate × duration, or the model's minimum charge if higher), even though the returned sheet is trimmed to its best loop and usually runs slightly shorter; everything is refunded if the job fails or is cancelled. Choosing a tool: animateSprite (this one) when you can describe the motion in text; transferMotion when you want an exact motion copied from a reference video or one of the named presets from listAnimationPresets (e.g. a standard walk or attack cycle); generatePose first when the source image is not yet in the pose the animation should start from. Omit `model` to run on hydra (the default) - see the `model` field for the per-model rates and the 4-credit minimum charge on forge/forge-pixel. Pass an optional request_id to tag the result so you can locate it later via listGenerations (type spritesheet). Requires an API key (user scope). The call returns 202 with a job id - poll getApiJob (pass wait 30 to long-poll) honouring poll_after_ms, until status is succeeded; its result field is exactly the response documented for this operation. Synchronous responses are deprecated but still supported: pass `async: false` to block until the result is ready and receive it as the response body. Synchronous calls run on the same queue: the response carries an X-Ludo-Job-Id header, and a job still running after 15 minutes comes back as 202 with the job instead of an error. Each account may have up to 50 generations queued or running at once via the API; a request beyond that returns 429 (code PENDING_JOBS_LIMIT).

        > **Credits:** This endpoint's credit cost varies by model and duration (credits/s × seconds, rounded to 0.1; a model's minimum charge applies when that product is lower). Available models: Hydra (3 credits/s, shortest duration 3s, so 9 credits minimum; 3s = 9, 3.5s = 10.5, 4s = 12, 4.5s = 13.5, 5s = 15) · Forge (1.5 credits/s, minimum charge 4 credits per generation; 1s = 4, 1.5s = 4, 2s = 4, 2.5s = 4, 3s = 4.5, 3.5s = 5.3, 4s = 6, 4.5s = 6.8, 5s = 7.5) · Forge Pixel (1.5 credits/s, minimum charge 4 credits per generation; 1s = 4, 1.5s = 4, 2s = 4, 2.5s = 4, 3s = 4.5, 3.5s = 5.3, 4s = 6, 4.5s = 6.8, 5s = 7.5) · Blitz (1.9 credits/s, minimum charge 4 credits per generation; 1.2s = 4, 1.5s = 4, 2s = 4, 2.5s = 4.8, 3s = 5.7, 3.5s = 6.7, 4s = 7.6) - LEGACY - scheduled for removal, do not use for new work · Eagle (2.6 credits/s, minimum charge 4 credits per generation; 1s = 4, 2s = 5.2, 3s = 7.8, 4s = 10.4) - LEGACY - scheduled for removal, do not use for new work · Eagle with Audio (3.1 credits/s, minimum charge 4 credits per generation; 1s = 4, 2s = 6.2, 3s = 9.3, 4s = 12.4) - LEGACY - scheduled for removal, do not use for new work.
      x-mcp-description: |-
