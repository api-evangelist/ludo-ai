components:
  schemas:
    AnimateSpriteKeyframesPayload:
      type: object
      description: Payload for generating an animated spritesheet that interpolates through up to three
        fixed keyframes (initial / middle / final). Runs on hydra (default), forge or forge-pixel - the
        models supporting a middle keyframe. Input images can be provided in base64 or URL. At least one
        of initial_image or middle_image must be provided.
      properties:
        motion_prompt:
          type: string
          description: 'Optional text description of the desired animation, e.g. "walking", "attack slash".
            When omitted, the motion is derived purely from the keyframes. When provided, describe exactly
            and unambiguously what the character should do. Specific or complex actions are fine; there
            is no need to simplify them. Do not over-describe, though: too much detail can harm the animation,
            and an action the model already knows should be named, not decomposed into its steps ("walking",
            never "move the left foot forward, then the right foot"). Do not restate what the keyframes
            already show (the character, its appearance and equipment, the art style, the background,
            the lighting, the camera), and leave frame count and timing to the frames and duration fields.
            Negative phrasing ("no background", "do not move the camera", "without a weapon") works only
            on hydra. On forge and forge-pixel it backfires: naming something you do not want makes it
            more likely to appear, so "without a weapon" tends to produce a weapon. On those models never
            phrase anything negatively; state only what should happen, and control everything else through
            the keyframes and the other fields.'
        initial_image:
          type: string
          description: The url OR base64 of the first keyframe. Optional when a middle_image is provided.
          example: <url> OR data:image/png;base64,...
        middle_image:
          type: string
          description: The url OR base64 of the middle keyframe the animation passes through between the
            initial and final frames.
          example: <url> OR data:image/png;base64,...
        final_image:
          type: string
          description: The url OR base64 of the final keyframe. Requires an initial_image or middle_image
            to anchor the animation.
          example: <url> OR data:image/png;base64,...
        model:
          type: string
          description: |-
            Model to use. Available models:
            - "hydra" (Hydra): 3 credits/s, shortest duration 3s, so 9 credits minimum · Most capable all-around model, generates audio
            - "forge" (Forge): 1.5 credits/s, min charge 4 credits · Sharper detail, simpler motion. Best for simple body shapes and short actions; may need a few tries
            - "forge-pixel" (Forge Pixel): 1.5 credits/s, min charge 4 credits · Best for low-res pixel art animations
          enum:
          - hydra
          - forge
          - forge-pixel
          default: hydra
          example: hydra
        loop:
          type: boolean
          default: true
          description: Trim the animation at the beginning or end to create a seamless loop. Not guaranteed
            to produce a perfect loop.
          example: true
        crop:
          type: boolean
          default: true
          description: Crop sprite frames to fit content. Results in smaller spritesheets but inconsistent
            frame sizes across different animations.
          example: true
        frames:
          type: number
          format: integer
          description: Number of frames in the output spritesheet.
          default: 36
          enum:
          - 4
          - 9
          - 16
          - 25
          - 36
          - 49
          - 64
          example: 36
        frame_size:
          type: number
          format: integer
          description: Size of each frame in pixels (width and height). 0 is for maximum resolution. -1
            is for AI 1.5x upscaling. -9 is for matching the size and position of the input frame.
          default: 0
          enum:
          - 32
          - 64
          - 96
          - 128
          - 192
          - 256
          - 384
          - 0
          - -1
          - -9
          example: 0
        margin_ratio:
          type: number
          format: float
          description: 'Deprecated: prefer margin_ratio_horizontal / margin_ratio_vertical. Amount of
            padding around the sprite as a ratio (0.0 to 1.0). Sets both axes to this value. A per-axis
            value, when also given, overrides this for that axis. Supplying any margin value selects margin_ratio_mode
            "manual" unless margin_ratio_mode is set explicitly.'
          deprecated: true
        margin_ratio_horizontal:
          type: number
          format: float
          description: Horizontal padding around the sprite as a ratio (0.0 to 1.0). Useful for animations
            that extend sideways (e.g., sword slashes, punches). Supplying a value selects margin_ratio_mode
            "manual" unless margin_ratio_mode is set explicitly; overrides the legacy margin_ratio on
            this axis.
        margin_ratio_vertical:
          type: number
          format: float
          description: Vertical padding around the sprite as a ratio (0.0 to 1.0). Useful for animations
            that extend up or down (e.g., jumps). Supplying a value selects margin_ratio_mode "manual"
            unless margin_ratio_mode is set explicitly; overrides the legacy margin_ratio on this axis.
        margin_ratio_mode:
          type: string
          description: Controls how margins are applied around the sprite. Omit it and send margin_ratio_horizontal
            / margin_ratio_vertical to get "manual" automatically. "manual" requires margin_ratio_horizontal
            and/or margin_ratio_vertical (or the legacy margin_ratio); sending "manual" with no margin
            value fails with HTTP 400. Sending "auto" or "none" explicitly together with a margin value
            fails with HTTP 400 (the value would be ignored).
          enum:
          - auto
          - manual
          - none
          default: auto
          example: auto
        image_type:
          type: string
          description: Type of sprite being animated. Affects generation parameters and styling.
          default: sprite
          enum:
          - sprite
          - sprite-vfx
          - item-icon
          - ui_asset
          - logo
          - sprite-tiling-horizontal
          - sprite-tiling-vertical
          - parallax_layer
          - tile
          - texture
          - portrait
          - card-art
          example: sprite
        duration:
          type: number
          format: float
          default: 3
          description: |-
            Duration in seconds. Available values depend on the model:
            - hydra: 3, 3.5, 4, 4.5, 5
            - forge: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5
            - forge-pixel: 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5
          example: 3
        augment_prompt:
          type: boolean
          default: true
          description: 'Augment the prompt behind the scenes. Disable to have more control. Incompatible
            with automatic framing: false requires margin_ratio_mode "manual" (with margin_ratio_horizontal
            and/or margin_ratio_vertical) or "none". Because margin_ratio_mode defaults to "auto", sending
            augment_prompt false on its own fails with HTTP 400.'
          example: true
        gif:
          type: boolean
          default: false
          description: When true, generates an animated GIF from the spritesheet and returns it in gif_url.
            Disabled by default to reduce response time.
          example: false
        individual_frames:
          type: boolean
          default: false
          description: When true, extracts each frame from the spritesheet as an individual image and
            returns the URLs in individual_frame_urls.
          example: false
        spritesheet_with_background:
          type: boolean
          default: false
          description: When true, also returns the spritesheet with background intact (before background
            removal). Useful for manually fixing background removal issues. The with-background spritesheet
            URL will be in spritesheet_with_background_url.
          example: false
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id
            returns the existing job instead of generating again. Also usable as the request_id filter
            of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with
            getApiJob. Set false for a synchronous response (deprecated but supported): the call then
            blocks until the result is ready.'
          example: true
    AnimateSpritePayload:
