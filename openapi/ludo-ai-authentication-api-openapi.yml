openapi: 3.2.0
info:
  version: 0.9.10
  title: Ludo.ai Authentication API
servers:
- url: /api
tags:
- name: Authentication
paths:
  /register/{email}:
    get:
      summary: 'Validates the email for the registration process. (Roles: user, none)'
      tags:
      - Authentication
      operationId: startRegistration
      security:
      - Bearer: []
      x-security-scopes:
      - none
      - user
      parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
      - name: captcha_token
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /register:
    post:
      summary: 'Registers a user. (Roles: user, none)'
      tags:
      - Authentication
      operationId: register
      security:
      - Bearer: []
      x-security-scopes:
      - none
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationPayload'
        required: true
  /check-email:
    post:
      summary: 'Checks if an email is valid for registration. (Roles: user, none)'
      tags:
      - Authentication
      operationId: checkEmailValid
      security:
      - Bearer: []
      x-security-scopes:
      - none
      - user
      responses:
        '200':
          description: Success
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StringValue'
        required: true
  /register-paywall2:
    post:
      summary: 'Registers a user with a subscription. (Roles: user, none)'
      tags:
      - Authentication
      operationId: registerPaywall2
      security:
      - Bearer: []
      x-security-scopes:
      - none
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationPaywall2Payload'
        required: true
  /register-paywall3:
    post:
      summary: 'Registers a user without a subscription. (Roles: user, none)'
      tags:
      - Authentication
      operationId: registerPaywall3
      security:
      - Bearer: []
      x-security-scopes:
      - none
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationPaywall3Payload'
        required: true
  /register-paywall/session/success:
    post:
      summary: 'Registers a user from a stripe checkout session. (Roles: user, none)'
      tags:
      - Authentication
      operationId: successPaywallSession
      security:
      - Bearer: []
      x-security-scopes:
      - none
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPayload'
        required: true
  /register-paywall/team:
    post:
      summary: 'Registers a user and joins a team. (Roles: user, none)'
      tags:
      - Authentication
      operationId: registerPaywallTeam
      security:
      - Bearer: []
      x-security-scopes:
      - none
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationPaywallTeamPayload'
        required: true
  /login:
    post:
      summary: 'Allow a user to log in and receive a JWT Token. (Roles: user, none)'
      tags:
      - Authentication
      operationId: login
      security:
      - Bearer: []
      x-security-scopes:
      - none
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Authentication'
        description: Username and password data
        required: true
  /auth/verify-magic-link:
    get:
      summary: Verify magic link code and authenticate user
      tags:
      - Authentication
      operationId: verifyMagicLink
      security:
      - Bearer: []
      x-security-scopes:
      - none
      parameters:
      - name: code
        in: query
        description: Magic link verification code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discord/link-start:
    post:
      summary: Starts the Discord account link flow and returns the OAuth url
      tags:
      - Authentication
      operationId: startDiscordLink
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordLinkStartResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Discord linking is not configured on this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/facebook:
    post:
      summary: 'Authenticates with facebook (Roles: user, none)'
      tags:
      - Authentication
      operationId: authenticateFacebook
      security:
      - Bearer: []
      x-security-scopes:
      - user
      - none
      parameters:
      - name: register
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StringValue'
        description: Facebook access token
        required: true
  /auth/google:
    post:
      summary: 'Authenticates with google (Roles: user, none)'
      tags:
      - Authentication
      operationId: authenticateGoogle
      security:
      - Bearer: []
      x-security-scopes:
      - user
      - none
      parameters:
      - name: register
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StringValue'
        description: Google access token
        required: true
  /auth/refresh-token:
    get:
      summary: 'Refreshes auth token (Roles: user)'
      tags:
      - Authentication
      operationId: refreshToken
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/referral:
    get:
      summary: 'Get referral info for the authenticated user (Roles: user)'
      tags:
      - Authentication
      operationId: getReferralInfo
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot-password:
    post:
      summary: 'Send password recovery email (Roles: none)'
      tags:
      - Authentication
      operationId: forgotPassword
      security:
      - Bearer: []
      x-security-scopes:
      - none
      responses:
        '200':
          description: Success
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StringValue'
        required: true
  /auth/reset-password:
    post:
      summary: 'Sets a new password (Roles: none)'
      tags:
      - Authentication
      operationId: resetPassword
      security:
      - Bearer: []
      x-security-scopes:
      - none
      responses:
        '200':
          description: Success
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordPayload'
        required: true
  /auth/2fa/verify:
    post:
      summary: Exchange a 2FA challenge ticket plus one proof for a full login payload.
      tags:
      - Authentication
      operationId: twoFactorVerify
      security:
      - Bearer: []
      x-security-scopes:
      - none
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The challenge ticket has expired or was already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed second-factor attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyPayload'
        required: true
  /auth/2fa/webauthn/login-options:
    post:
      summary: WebAuthn request options for a login challenge (ticket) or a step-up (Bearer).
      tags:
      - Authentication
      operationId: twoFactorWebauthnLoginOptions
      security:
      - Bearer: []
      x-security-scopes:
      - none
      - user
      responses:
        '200':
          description: Success
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: The challenge ticket has expired or was already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorLoginOptionsPayload'
  /auth/2fa/totp/setup:
    post:
      summary: Begin authenticator-app enrolment; returns the secret and a QR code.
      tags:
      - Authentication
      operationId: twoFactorTotpSetup
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorSetupResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed second-factor attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorStepUpPayload'
  /auth/2fa/totp/confirm:
    post:
      summary: Confirm authenticator enrolment with a code; returns a fresh token and recovery…
      tags:
      - Authentication
      operationId: twoFactorTotpConfirm
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorEnrollResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed second-factor attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorTotpConfirmPayload'
        required: true
  /auth/2fa/webauthn/register-options:
    post:
      summary: 'WebAuthn creation options for enrolling a passkey. (Roles: user)'
      tags:
      - Authentication
      description: 'Requires NO step-up proof, even on an account that already has 2FA: this call mutates nothing, and the only thing it exposes that the session cannot already read is excludeCredentials, whose ids GET /auth/2fa/status returns to the same session. The single proof for adding a passkey accompanies POST /auth/2fa/webauthn/register. Asking at both would cost two distinct proofs per passkey, since every proof type is single-use.'
      operationId: twoFactorWebauthnRegisterOptions
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed second-factor attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorStepUpPayload'
  /auth/2fa/webauthn/register:
    post:
      summary: 'Finish passkey enrolment with the authenticator''s attestation. (Roles: user)'
      tags:
      - Authentication
      description: 'The mutating half of the ceremony, and the ONLY place a step-up proof is required when adding a passkey to an account that already has 2FA: send exactly one of totp_code, recovery_code or webauthn_assertion alongside the attestation. First-time enrolment on an unprotected account needs no proof.'
      operationId: twoFactorWebauthnRegister
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRegisterResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed second-factor attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorRegisterPayload'
        required: true
  /auth/2fa/disable:
    post:
      summary: 'Turn two-factor authentication off. Requires a step-up proof. (Roles: user)'
      tags:
      - Authentication
      operationId: twoFactorDisable
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorDisableResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed second-factor attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorStepUpPayload'
  /auth/2fa/webauthn/{credentialId}:
    delete:
      summary: 'Remove a registered passkey. Requires a step-up proof. (Roles: user)'
      tags:
      - Authentication
      operationId: twoFactorRemoveCredential
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRemoveCredentialResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such passkey on this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed second-factor attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorStepUpPayload'
  /auth/2fa/recovery-codes:
    post:
      summary: 'Regenerate the ten recovery codes. Requires a step-up proof. (Roles: user)'
      tags:
      - Authentication
      operationId: twoFactorRegenerateRecoveryCodes
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRecoveryCodesResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many failed second-factor attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorStepUpPayload'
  /auth/2fa/status:
    get:
      summary: 'Current two-factor state for the authenticated user. (Roles: user)'
      tags:
      - Authentication
      operationId: twoFactorStatus
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatusResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/info:
    post:
      summary: 'Updates the user info (Roles: user)'
      tags:
      - Authentication
      operationId: updateUserInfo
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfoPayload'
        required: true
    delete:
      summary: 'Deletes the user (Roles: user)'
      tags:
      - Authentication
      operationId: deleteUser
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /user/api-key:
    get:
      summary: 'Generates a new API key (Roles: user)'
      tags:
      - Authentication
      operationId: generateApiKey
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/validate-api-key:
    get:
      description: Validates an API key. Returns 200 if valid, 403 if invalid.
      tags:
      - Authentication
      operationId: validateApiKeyEndpoint
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Valid API key
        '403':
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Validate api key endpoint
      x-summary-source: derived
components:
  schemas:
    RegistrationPayload:
      type: object
      required:
      - email
      - password
      - name
      - code
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
        code:
          type: string
        captcha_token:
          type: string
    SubscriptionStats:
      type: object
      properties:
        revenue_year:
          type: number
          format: float
        revenue_12months:
          type: number
          format: float
        revenue_total:
          type: number
          format: float
        plan_name:
          type: string
        plan_interval:
          type: string
        is_customer:
          type: boolean
        became_customer_date:
          type: integer
          format: int64
    PaymentPlanMetadata:
      type: object
      properties:
        projects:
          type: string
        description:
          type: string
        seats:
          type: string
        favorites:
          type: string
        team:
          type: string
        amount_text:
          type: string
        credits:
          type: string
        premium:
          type: string
        magic_link:
          type: string
        api:
          type: string
        queue_concurrency:
          type: string
        rate_limits:
          type: string
    TwoFactorEnrollResponse:
      type: object
      properties:
        token:
          type: string
          description: Fresh token. Enrolling revokes every existing session, so the client must adopt this one immediately or log itself out.
        recovery_codes:
          type: array
          description: Shown exactly once. EMPTY when the account already had recovery codes (a second factor type was added) — render that as "your existing recovery codes still apply", never as an empty list of ten.
          items:
            type: string
    PurchaseIp:
      type: object
      properties:
        ip:
          type: string
        date:
          type: integer
          format: int64
          description: Unix epoch seconds when this IP was captured at a purchase action
    MarketingConsent:
      type: object
      properties:
        granted:
          type: boolean
        date:
          type: integer
          format: int64
        source:
          type: string
    Subscription:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        collection_method:
          type: string
        cancel_at_period_end:
          type: boolean
        canceled_at:
          type: integer
          format: int64
        cancel_at:
          type: integer
          format: int64
        created:
          type: integer
          format: int64
        current_period_end:
          type: integer
          format: int64
        current_period_start:
          type: integer
          format: int64
        customer:
          type: string
        days_until_due:
          type: integer
          format: int64
        ended_at:
          type: integer
          format: int64
        plan:
          $ref: '#/components/schemas/PaymentPlan'
        quantity:
          type: integer
          format: int64
        start_date:
          type: integer
          format: int64
        status:
          type: string
        tax_percent:
          type: integer
          format: int64
        trial_end:
          type: integer
          format: int64
        trial_start:
          type: integer
          format: int64
        billing_cycle_anchor:
          type: integer
          format: int64
        latest_invoice:
          type: string
        from_team:
          type: boolean
        pause_collection:
          $ref: '#/components/schemas/SubscriptionPauseCollection'
        resume_requires_payment:
          type: boolean
          description: Present (true) only while the subscription is paused and at least one billing cycle was skipped (voided) during the pause, meaning a resume will immediately charge the full plan price for a fresh cycle.
        ended_immediately:
          type: boolean
          description: 'Present (true) only on an unsubscribe response when the cancel landed after a new period started but before its renewal was charged: the subscription was ended at once and the renewal discarded, instead of running (and billing) until the end of that new period.'
        pause_started_at:
          type: integer
          format: int64
          description: 'When the current pause was REQUESTED. Stripe records only where a pause ends (pause_collection.resumes_at), so this is stamped into subscription metadata by pauseSubscription. Audit only: the ceiling and the mid-pause email are measured from pause_billing_from, and fall back to this only when that is absent. Absent on pauses that began before the extension feature shipped.'
        pause_billing_from:
          type: integer
          format: int64
          description: 'When collection actually stops, i.e. the current_period_end that was current at the moment of pausing, and the anchor the six-month extension ceiling and the mid-pause midpoint are measured from. Must be stamped at pause time: with pause_collection.behavior "void" Stripe keeps advancing the billing cycle through the pause, so current_period_end read later names a different period. Absent on pauses that began before the extension feature shipped, which are then capped from pause_started_at instead (stricter, by the length of the paid-through tail).'
        pause_extended_at:
          type: integer
          format: int64
          description: When the current pause was extended. Present at most once per pause; while it is present the Extend control must not be offered, because extendPause refuses a second extension.
        pause_can_extend:
          type: boolean
          description: 'Present (true) only when extendPause would accept at least one more month right now: the pause is running, has not been extended, is not scheduled to cancel, and one more month still fits under the six-month ceiling measured from pause_billing_from (or pause_started_at). Gate the Extend control on this rather than on pause_extended_at alone, which would invite a subscriber already at the ceiling to extend and then refuse them. Absent on pauses with no anchor, where the server cannot tell from Stripe alone.'
