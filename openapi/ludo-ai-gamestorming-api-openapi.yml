openapi: 3.2.0
info:
  version: 0.9.10
  title: Ludo.ai Gamestorming API
servers:
- url: /api
tags:
- name: Gamestorming
paths:
  /suggest/project/{id}/assets:
    post:
      summary: 'Suggests assets based on a project (Roles: user)'
      tags:
      - Gamestorming
      operationId: suggestProjectAssets
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThreeDAsset'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestPayload'
        required: true
  /suggest/project/{id}/videos:
