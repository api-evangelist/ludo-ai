        source: "curl -X POST \"https://api.ludo.ai/api/assets/image/edit\" \\\n  -H \"Authorization: ApiKey YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"image\":\"<url> OR data:image/png;base64,...\",\"prompt\":\"string\"}'"
      - lang: JavaScript
        label: JavaScript
        source: "const response = await fetch(\"https://api.ludo.ai/api/assets/image/edit\", {\n  method: \"POST\",\n  headers: {\n    \"Authorization\": \"ApiKey YOUR_API_KEY\",\n    \"Content-Type\": \"application/json\"\n  },\n  body: JSON.stringify({\n    \"image\": \"<url> OR data:image/png;base64,...\",\n    \"prompt\": \"string\"\n  })\n});\n\nconst data = await response.json();\nconsole.log(data);"
      - lang: Python
