openapi: 3.2.0
info:
  title: Ludo Ai Images API
  x-refined-note:
  - x-refined-note differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Images across 2 of this provider''s published API definitions: ludo-ai-openapi.json, ludo-ai-images-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /api
- url: https://api.ludo.ai/api
  description: Production Server
tags:
- name: Images
paths:
  /assets/image:
    post:
      summary: Generate game-art images from a text prompt alone, selecting an image_type (e.g.
      tags:
      - Images
      operationId: createImage
      x-credit-action: GENERATE_IMAGE
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateImagePayload'
        required: true
    servers:
    - url: /api
  /assets/image/style:
    post:
      summary: 'Generate new images that match the visual style of a reference image: supply a…'
      tags:
      - Images
      operationId: generateWithStyle
      x-credit-action: GENERATE_IMAGE
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateWithStylePayload'
        required: true
    servers:
    - url: /api
  /assets/image/edit:
    post:
      summary: 'Modify an existing image according to text instructions: supply a source image…'
      tags:
      - Images
      operationId: editImage
      x-credit-action: GENERATE_IMAGE
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditImagePayload'
        required: true
    servers:
    - url: /api
  /assets/image/remove-background:
    post:
      summary: Remove the background from a single image, returning the subject isolated on a…
      tags:
      - Images
      operationId: removeBackground
      x-credit-action: GENERATE_IMAGE
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveBackgroundPayload'
        required: true
    servers:
    - url: /api
  /assets/image/upscale:
    post:
      summary: 'Upscale an image: the same picture at a higher resolution, up to 4x, with the…'
      tags:
      - Images
      operationId: upscaleImage
      x-credit-action: GENERATE_IMAGE
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpscaleImagePayload'
        required: true
    servers:
    - url: /api
  /assets/images/results:
    get:
      description: '**Deprecated:** prefer `GET /assets/generations` (all types, paginated, same source filter). This endpoint continues to work; no removal is scheduled.

        List images you previously generated through the API, most recent first. This is a free read-only history lookup (no credits, no generation); it does not create anything. Pass an optional request_id query parameter to return only the results tagged with that id when you originally called createImage, editImage, generateWithStyle, generatePose, rotateSprite, or removeBackground. Requires an API key (user scope).'
      tags:
      - Images
      operationId: getImageResults
      deprecated: true
      x-mcp-exclude: true
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      parameters:
      - name: request_id
        in: query
        description: Filter results by request_id
        required: false
        schema:
          type: string
      - name: source
        in: query
        description: 'Which surface the results were generated from: api (default, your API/MCP generations from the last 7 days), web (your Ludo web studio generations, no time limit), or all'
        required: false
        schema:
          type: string
          enum:
          - api
          - web
          - all
          default: api
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImageResult'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get image results
      x-summary-source: derived
    servers:
    - url: /api
  /images/create:
    servers:
    - url: https://api.ludo.ai/api
      description: Production Server
    post:
      operationId: postImagesCreate
      summary: Ludo.ai Generate a game-ready image
      description: Generate sprites, icons, backgrounds, UI assets, textures, and other game-ready images from text descriptions. Supports multiple art styles and perspectives. Costs 0.5 credits per image generated.
      tags:
      - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImageRequest'
      responses:
        '200':
          description: Successfully generated image(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded or insufficient credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiKeyAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: createImage
  /images/edit:
    servers:
    - url: https://api.ludo.ai/api
      description: Production Server
    post:
      operationId: postImagesEdit
      summary: Ludo.ai Edit an existing image
      description: Modify an existing image using text instructions for smart editing. Supports operations like background removal, color adjustments, and content additions. An optional reference image can guide style or content. Costs 0.5 credits per image generated.
      tags:
      - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditImageRequest'
      responses:
        '200':
          description: Successfully edited image(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiKeyAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: editImage
  /images/generate-with-style:
    servers:
    - url: https://api.ludo.ai/api
      description: Production Server
    post:
      operationId: postImagesGenerateWithStyle
      summary: Ludo.ai Generate an image matching a reference style
      description: Generate new content while maintaining the visual style of a reference image. Useful for creating consistent asset sets that share an art direction. Costs 0.5 credits per image generated.
      tags:
      - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateWithStyleRequest'
      responses:
        '200':
          description: Successfully generated styled image(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiKeyAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: generateWithStyle
  /images/generate-pose:
    servers:
    - url: https://api.ludo.ai/api
      description: Production Server
    post:
      operationId: generatePose
      summary: Ludo.ai Generate a new pose for an existing sprite
      description: Generate a new pose for an existing sprite character. Best used before animateSprite to ensure the starting pose matches the intended animation. Returns a suggested motion prompt for optimal animation results. Costs 0.5 credits per image generated.
      tags:
      - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePoseRequest'
      responses:
        '200':
          description: Successfully generated pose(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoseResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - apiKeyAuth: []
components:
  schemas:
    GenerateImagePayload:
      type: object
      description: Payload for generating an image from text prompt
      required:
      - image_type
      - prompt
      properties:
        image_type:
          x-swagger-data: imageTypes
          type: string
          description: What kind of image to generate.
        prompt:
          type: string
          description: Text description of the image to generate. The more detailed the prompt, the more accurate the image will be.
        art_style:
          x-swagger-data: artStyles
          type: string
          description: Visual art style for the sprite (e.g., "Pixel Art", "Cartoonish", "Realistic").
        perspective:
          x-swagger-data: perspectives
          type: string
          description: Camera angle/view for the sprite (e.g., "Side view", "Front view", "Isometric").
        aspect_ratio:
          x-swagger-data: aspectRatios
          type: string
          description: Aspect ratio of the output image.
        n:
          type: integer
          format: integer
          default: 1
          minimum: 1
          maximum: 8
          description: Number of image variations to generate
        augment_prompt:
          type: boolean
          default: true
          description: Rewrites your prompt behind the scenes into the form the model works best with. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    PublicJobError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
    ImageResult:
      type: object
      properties:
        url:
          type: string
        request_id:
          type: string
        created_at:
          type: integer
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        metadata:
          type: string
        error_payload:
          type: string
        intent:
          type: object
          description: Stripe intent details sent with 3D Secure (406) errors
          properties:
            id:
              type: string
            type:
              type: string
              enum:
              - payment
              - setup
            client_secret:
              type: string
    UpscaleImagePayload:
      type: object
      description: Payload for upscaling an image
      required:
      - image
      properties:
        image:
          type: string
          description: URL or base64-encoded image to upscale, below 2048px on its longest side.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    GenerateWithStylePayload:
      type: object
      description: Payload for generating new content while maintaining the visual style of a reference image
      required:
      - style_image
      - prompt
      properties:
        style_image:
          type: string
          description: URL or base64-encoded reference image whose visual style should be matched.
        prompt:
          type: string
          description: Text description of what to generate (e.g., "a warrior character", "a forest background", "a treasure chest").
        image_type:
          x-swagger-data: imageTypes
          type: string
          description: What kind of image to generate.
          default: sprite
        n:
          type: number
          format: integer
          description: Number of variations to generate (1-4).
          minimum: 1
          maximum: 4
          default: 1
        augment_prompt:
          type: boolean
          default: true
          description: Rewrites your prompt behind the scenes into the form the model works best with. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    EditImagePayload:
      type: object
      description: Payload for editing an existing image based on text instructions
      required:
      - image
      properties:
        image:
          type: string
          description: URL or base64-encoded source image to edit.
        prompt:
          type: string
          description: Text description of the changes to make (e.g., "add clouds to the sky", "make it darker", "change the color scheme to warmer tones"). Required, except with mask_mode "erase". With a mask, describe what should fill the masked area. Describe only the change, never the background's transparency ("transparent background", "on transparency", "transparent padding"); asking for it often paints a checkerboard into the pixels instead. A sprite keeps its transparent background on its own, and removeBackground is the tool for removing one.
        reference_image:
          type: string
          description: Optional URL or base64-encoded reference image for style or content guidance. Not used with mask_mode "erase".
        mask:
          type: string
          description: Optional URL or base64-encoded PNG that limits the edit to one area of the image. White marks the area to change, black the area to keep. It must be exactly the same width and height as `image`, or the call returns 400. Without a mask the whole image is re-rendered, which can shift colours and details outside the part you meant to change. A masked edit costs more than an unmasked one (see the price).
        mask_mode:
          type: string
          enum:
          - replace
          - erase
          description: Only with `mask`. "replace" (the default) redraws the masked area from `prompt`; "erase" removes what is in the masked area and takes no prompt.
        image_type:
          x-swagger-data: imageTypes
          type: string
          example: sprite
          description: What kind of image the source is (e.g. "sprite"). Not needed when `image` is the URL of an image you generated on Ludo in the last 30 days, which keeps its own type. Set it when the image is an upload or a link from elsewhere, so a sprite is edited as a sprite and keeps its transparent background.
        n:
          type: number
          format: integer
          description: Number of edited variations to generate (1-4).
          minimum: 1
          maximum: 4
          default: 1
        augment_prompt:
          type: boolean
          default: true
          description: Rewrites your prompt behind the scenes into the form the model works best with. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    RemoveBackgroundPayload:
      type: object
      description: Payload for removing the background of an image
      required:
      - image
      properties:
        image:
          type: string
          description: URL or base64-encoded image to remove the background from.
        crop:
          type: boolean
          default: false
          description: Whether to crop/trim the result to fit the content.
        creative_edit:
          type: boolean
          default: true
          description: Higher quality results but the image will not be exactly the same as the input.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    PublicJob:
      type: object
      required:
      - id
      - task_type
      - status
      - created_at
      properties:
        id:
          type: string
        task_type:
          type: string
          description: 'The public operationId that created this job (e.g. createImage). Determines the shape of `result`: it is exactly the 200 response body documented for that operation.'
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - canceled
        request_id:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix ms
        finished_at:
          type: integer
          format: int64
        credits_charged:
          type: number
          format: float
          description: Credits this job cost you. Charged at enqueue; reported as 0 once a job fails or is canceled, since the charge is refunded.
        result:
          type: object
          description: Present only when status is succeeded. Same shape as the synchronous response of the operation named by task_type.
        error:
          $ref: '#/components/schemas/PublicJobError'
        poll_after_ms:
          type: integer
          format: int32
          description: 'Present while the job is queued or running: wait at least this many milliseconds before polling again. Prefer GET /assets/jobs/{id}?wait=30 (long-poll) over tight loops.'
    ImageResponse:
      type: object
      properties:
        images:
          type: array
          description: Array of generated image objects.
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
                description: URL of the generated image. Expires after 7 days.
        request_id:
          type: string
          description: The request ID if one was provided.
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong.
        code:
          type: string
          description: Machine-readable error code.
    CreateImageRequest:
      type: object
      required:
      - prompt
      - image_type
      properties:
        prompt:
          type: string
          description: Detailed description of the image to generate.
        image_type:
          type: string
          description: The type of game asset to generate.
          enum:
          - sprite
          - icon
          - screenshot
          - art
          - asset
          - sprite-vfx
          - ui_asset
          - fixed_background
          - texture
          - 3d
          - generic
        art_style:
          type: string
          description: The art style for the generated image.
          enum:
          - Pixel Art (16-Bit)
          - Pixel Art (8-Bit)
          - Low Poly
          - Cartoonish
          - Stylized 3D
          - Flat Design
          - Anime/Manga
          - Voxel Art
        perspective:
          type: string
          description: The camera perspective for the generated image.
          enum:
          - Side-Scroll
          - Top-Down
          - Isometric
          - First-Person
          - Third-Person
          - 2.5D
        aspect_ratio:
          type: string
          description: The aspect ratio for the generated image.
          default: default
          enum:
          - default
          - ar_1_1
          - ar_4_3
          - ar_16_9
          - ar_9_16
        n:
          type: integer
          description: Number of image variations to generate.
          minimum: 1
          maximum: 8
          default: 1
        request_id:
          type: string
          description: Client-provided ID to retrieve results later via the results endpoint.
    PoseResponse:
      type: object
      properties:
        images:
          type: array
          description: Array of generated pose image objects.
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
                description: URL of the generated pose image. Expires after 7 days.
              pose:
                type: string
                description: The pose that was generated.
              motion_prompt:
                type: string
                description: Suggested motion prompt for use with animateSprite to get optimal animation results from this pose.
        request_id:
          type: string
          description: The request ID if one was provided.
    GenerateWithStyleRequest:
      type: object
      required:
      - style_image
      - prompt
      - image_type
      properties:
        style_image:
          type: string
          description: URL or base64-encoded reference image for style matching.
        prompt:
          type: string
          description: Description of what to generate while maintaining the reference style.
        image_type:
          type: string
          description: The type of game asset to generate.
          enum:
          - sprite
          - icon
          - screenshot
          - art
          - asset
          - sprite-vfx
          - ui_asset
          - fixed_background
          - texture
          - 3d
          - generic
        n:
          type: integer
          description: Number of image variations to generate.
          minimum: 1
          maximum: 4
          default: 1
        request_id:
          type: string
          description: Client-provided ID to retrieve results later via the results endpoint.
    EditImageRequest:
      type: object
      required:
      - image
      - prompt
      properties:
        image:
          type: string
          description: URL or base64-encoded image to edit.
        prompt:
          type: string
          description: Description of changes to apply to the image.
        reference_image:
          type: string
          description: URL or base64-encoded reference image for style or content guidance.
        n:
          type: integer
          description: Number of edited variations to generate.
          minimum: 1
          maximum: 4
          default: 1
        request_id:
          type: string
          description: Client-provided ID to retrieve results later via the results endpoint.
    GeneratePoseRequest:
      type: object
      required:
      - image
      - pose
      properties:
        image:
          type: string
          description: URL or base64-encoded sprite image.
        pose:
          type: string
          description: Target pose for the sprite. Can be a preset or custom description.
          enum:
          - Idle (Front)
          - Idle (Back)
          - Walk / Run (Left)
          - Attack Ready
          - Jumping
          - Crouching
          - Flying
          - Defending / Blocking
        description:
          type: string
          description: Additional instructions to guide pose generation.
        n:
          type: integer
          description: Number of pose variations to generate.
          minimum: 1
          maximum: 4
          default: 1
