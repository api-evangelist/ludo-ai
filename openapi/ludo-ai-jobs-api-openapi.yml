        url:
          type: string
        image:
          $ref: '#/components/schemas/GameImage'
        pil_image:
          $ref: '#/components/schemas/PILImage'
        seed:
          type: integer
          format: int64
        duration:
          type: number
          format: float
        has_audio:
          type: boolean
        model:
          type: string
          description: Codename of the model that generated the video, e.g. eagle. Absent on videos created before it was recorded.
        pixel_grid:
          type:
          - array
          - 'null'
          description: Pixel-art grid dimensions [width, height] detected/used by the generation, or null. Reported by pixel-art-aware models (forge-pixel); must always be persisted with the video.
          items:
            type: integer
            format: int32
        reference_url:
          type: string
          description: Motion clip the animation was driven by (motion transfer presets), as reported by the ML. Absent on videos saved before it was recorded.
        crop_and_center_image:
          type: boolean
        middle_image:
          $ref: '#/components/schemas/GameImage'
        final_image:
          $ref: '#/components/schemas/GameImage'
        margin_ratio:
          type: number
          format: float
        margin_ratio_horizontal:
          type: number
          format: float
        margin_ratio_vertical:
          type: number
          format: float
    VoicePreset:
      type: object
      properties:
        id:
          type: string
        language:
          type: string
        emotion:
          type: string
    QueueUpscaleImagePayload:
      type: object
      required:
      - image
      properties:
        image:
          $ref: '#/components/schemas/GameImage'
        request_id:
          type: string
    Spritesheet:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        id:
          type: string
        audio_b64:
          type: string
        duration:
          type: number
          format: float
        billed_duration:
          type: number
          format: float
          description: 'Seconds the generation was billed for: the length of the video Prometheus generated, never more than the duration the user requested. `duration` is the sheet''s loop-trimmed length as Prometheus reports it and is usually shorter.'
        start_timestamp:
          type: number
          format: integer
        end_timestamp:
          type: number
          format: integer
        num_frames:
          type: number
          format: integer
        num_cols:
          type: number
          format: integer
          description: Columns in the frame grid. Absent on legacy sheets, which use a square grid of ceil(sqrt(num_frames)) per side.
        num_rows:
          type: number
          format: integer
          description: Rows in the frame grid. Absent on legacy sheets, which use a square grid of ceil(sqrt(num_frames)) per side.
        max_num_frames:
          type: number
          format: integer
        margin_ratio:
          type: number
          format: integer
        margin_ratio_horizontal:
          type: number
          format: float
        margin_ratio_vertical:
          type: number
          format: float
        margin_ratio_mode:
          type: string
        target_frame_size:
          type: number
          format: integer
        loop:
          type: boolean
        bad_loop:
          type: boolean
        out_of_frame:
          type: boolean
        crop:
          type: boolean
        original_prompt:
          type: string
        motion_prompt:
          type: string
        prompt:
          type: string
        seed:
          type: number
          format: integer
        sprite_sheet:
          $ref: '#/components/schemas/PILImage'
        sprite_sheet_b64:
          type: string
        sprite_sheet_raw_b64:
          type: string
        sprite_sheet_watermarked_b64:
          type: string
          description: URL of the watermarked variant of sprite_sheet_b64 (object key = clean key + "_wm"). Present only when generated by a free user; served IN PLACE of sprite_sheet_b64 to free viewers. sprite_sheet_b64 itself always stays the clean asset.
        sprite_sheet_raw_watermarked_b64:
          type: string
          description: Watermarked variant of sprite_sheet_raw_b64 (see sprite_sheet_watermarked_b64).
        watermarked:
          type: boolean
          readOnly: true
          description: Response-only. True when the served sprite_sheet_b64 is the watermarked variant (free viewer). Never persisted - stripped from inbound bodies.
        video:
          $ref: '#/components/schemas/GeneratedVideo'
        preview_video_b64:
          type: string
        first_frame_b64:
          type: string
        last_frame_b64:
          type: string
        image:
          $ref: '#/components/schemas/GameImage'
        middle_image:
          $ref: '#/components/schemas/GameImage'
        final_image:
          $ref: '#/components/schemas/GameImage'
        has_audio:
          type: boolean
        model:
          type: string
          description: Codename of the model that generated (or last re-rendered) the animation, e.g. blitz, forge, tango. Absent on sheets created before it was recorded.
        is_edited:
          type: boolean
          description: True when this spritesheet was produced by an edit (prompt, outpaint, or fix_loop) - the whole animation was re-rendered, so frames may drift from the original.
