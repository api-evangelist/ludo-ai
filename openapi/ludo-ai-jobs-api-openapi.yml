          - humanoid_template
          - humanoid_template_hands
          default: general
          description: 'Which skeleton to build. general (default) lets the model choose; humanoid/game bias toward anime-style and classic game-character rigs. The humanoid_template options pin a standard humanoid skeleton with named joints: humanoid_template (22 joints) or humanoid_template_hands (52, five fingers per hand). Only for two-armed, two-legged characters.'
        joint_naming:
          type: string
          enum:
          - smpl
          - mixamo
          - humanik
          - unreal
          - godot
          - rigify
          - vroid
          default: smpl
          description: Bone naming convention for the joints we can identify. Purely a relabel - the skeleton is identical. Joints outside the humanoid template keep their generic names.
        render_video:
          type: boolean
          default: true
        as_new_asset:
          type: boolean
          default: false
          description: Re-rig - save the rigged result as a new 3D asset entry instead of overwriting the source, preserving the original model and its saved animations.
    GenerationsSearchResult:
      type: object
      properties:
        similar_games:
          type: array
          items:
            $ref: '#/components/schemas/SimilarGame'
    PrometheusGameImage:
      type: object
      properties:
        game_id:
          type: string
        hash:
          type: integer
          format: int64
        id:
          type: string
        origin:
          type: string
        similarity:
          type: number
          format: float
    Animation3DClip:
      type: object
      required:
      - _id
      - user_id
      - model_asset_id
      properties:
        _id:
          type: string
        user_id:
          type: string
        model_asset_id:
          type: string
          description: Parent 3D asset id (the GenerationHistory _id, which for three_d_asset equals image.id).
        clip_name:
          type: string
        prompt:
          type: string
        preset_id:
          type: string
          description: Set when the clip came from the preset library (retargeting) rather than a text prompt.
        mode:
          type: string
          enum:
          - rot_trans
          - rot_only
        seed:
          type: integer
        glb_url:
          type: string
          description: Uploaded animation-only GLB (skeleton + one clip, no mesh). May be gzip-compressed like model GLBs.
        preview_url:
          type: string
          description: Uploaded mp4 preview of the clip playing on the model.
        accepted:
          type: boolean
          description: Whether this clip is baked into the model's downloadable full GLB. Every generated clip is persisted (so the frontend never loses them); `accepted` is the separate opt-in that controls download inclusion.
        motion:
          type: number
          format: float
        fit_rmse:
          type: number
          format: float
        date:
          type: integer
          format: int64
        deleted:
          type: boolean
    SimilarGame:
      type: object
      properties:
        id:
          type: string
        similarity:
          type: number
          format: float
    RenderSprite3DPayload:
      type: object
      required:
      - perspective
      - style_id
      properties:
        request_id:
          type: string
        generated_model:
          $ref: '#/components/schemas/ThreeDModelInput'
        user_model:
          type: string
          description: URL of an uploaded GLB (rigged, to animate it). Provide this OR generated_model.
        user_model_file_type:
          type: string
          enum:
          - glb
        animation_clip_id:
          type: string
          description: One of the model's saved animations (an Animation3DClip id) to render.
        preset_id:
          type: string
          description: An animation preset (/utils/animation-presets) the ML retargets onto the rigged model and renders.
        crop_loop:
          type: boolean
          description: With preset_id, trim the preset to the span that loops seamlessly. Omit to follow the preset's own loop flag.
        model_animation:
          type: string
          description: Name of an animation the model file itself carries. With no animation at all the model renders as a still.
        perspective:
          type: string
          enum:
          - horizon
          - low
          - isometric
          - high
          - top
        directions:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          description: Where the camera stands around a character facing S, each view at most once. One result per view, in this order, rendered together on the same frame, scale and floor, so the views line up.
          items:
            type: string
            enum:
            - S
            - SW
            - W
            - NW
            - N
            - NE
            - E
            - SE
        direction:
          type: string
          description: 'Deprecated: one view. Use directions.'
          enum:
          - S
          - SW
          - W
          - NW
          - N
          - NE
          - E
          - SE
        style_id:
          type: string
          description: id of a style from /utils/sprite3d-styles
        style_version:
          type: integer
          description: Version of the style; omit for its current one.
        style_params:
          type: object
          description: Overrides of the style's settings, by name, each one of its listed choices (or true/false, or a colour for a colour setting).
        keep_horizontal_travel:
          type: boolean
          description: Keep the animation's ground travel (the character moves across the frame). Off by default.
        keep_vertical_travel:
          type: boolean
          description: Keep the animation's vertical root motion (jumps, bobbing). On by default.
        target_frame_size:
          type: integer
          minimum: 32
          maximum: 640
          description: Sprite size in px (the frame's longer side); default 256.
        num_frames:
          type: integer
          minimum: 4
          maximum: 100
          description: Frames per sheet, sampled over the clip (fewer when the clip has fewer keyframes; a still gives one). Default 16.
        loop:
          type: boolean
          description: Sample the clip as a seamless loop. Omit to follow the animation's own loop flag.
    MediaElement:
      type: object
      properties:
        type:
          type: string
        url:
          type: string
    PublicJob:
      type: object
      required:
      - id
      - task_type
      - status
      - created_at
      properties:
        id:
          type: string
        task_type:
          type: string
          description: 'The public operationId that created this job (e.g. createImage). Determines the shape of `result`: it is exactly the 200 response body documented for that operation.'
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - canceled
        request_id:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix ms
        finished_at:
          type: integer
          format: int64
        credits_charged:
          type: number
          format: float
          description: Credits this job cost you. Charged at enqueue; reported as 0 once a job fails or is canceled, since the charge is refunded.
        result:
          type: object
          description: Present only when status is succeeded. Same shape as the synchronous response of the operation named by task_type.
        error:
          $ref: '#/components/schemas/PublicJobError'
        poll_after_ms:
          type: integer
          format: int32
          description: 'Present while the job is queued or running: wait at least this many milliseconds before polling again. Prefer GET /assets/jobs/{id}?wait=30 (long-poll) over tight loops.'
  securitySchemes:
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: 'For accessing the API a valid API Key token must be passed in all the queries in

        the ''Authorization'' header.

        The following syntax must be used in the ''Authorization'' header: ApiKey xxxxxx.yyyyyyy.zzzzzz

        '
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: 'For accessing the API a valid JWT token must be passed in all the queries in

        the ''Authorization'' header.

        A valid JWT token is generated by the API and retourned as answer of a call

        to the route /login giving a valid user & password.

        The following syntax must be used in the ''Authorization'' header: Bearer xxxxxx.yyyyyyy.zzzzzz

        '
