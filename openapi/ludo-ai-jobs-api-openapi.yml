openapi: 3.2.0
info:
  version: 0.9.10
  title: Ludo.ai Jobs API
servers:
- url: /api
tags:
- name: Jobs
paths:
  /assets/jobs:
    get:
      description: List the generation jobs you started through the API or MCP, most recent first. Web-app jobs are not included. This is a free read-only lookup (no credits, no generation). Filter with a comma-separated status list; limit defaults to 50 and is capped at 100. Requires an API key (user scope).
      tags:
      - Jobs
      operationId: listApiJobs
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      parameters:
      - name: status
        in: query
        description: Comma-separated statuses to include (queued, running, succeeded, failed, canceled). Defaults to all.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of jobs to return. Defaults to 50, capped at 100.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: List api jobs
      x-summary-source: derived
  /assets/jobs/{id}:
    get:
      description: 'Fetch one job you started through the API or MCP. Statuses: queued, running (both non-terminal - the response carries poll_after_ms, wait at least that long before asking again), then succeeded (read `result`), failed (read `error`: {code, subcode, message, retriable}; the held credits are refunded) or canceled. Generations typically finish within a few minutes; a job still queued after 15 minutes can be cancelled and resubmitted. Better still, pass wait= (up to 60) to long-poll: the request is held until the job reaches a terminal state, so one call replaces a polling loop. Once status is succeeded, `result` holds exactly what the synchronous form of the operation named by task_type would have returned. This is a free read-only lookup (no credits). Requires an API key (user scope).'
      tags:
      - Jobs
      operationId: getApiJob
      x-mcp-description: 'Poll the status of a generation job started by any tool. Every generation tool returns `{id, status}`; call getApiJob with that id until status is `succeeded` (then read `result`, shaped exactly like the tool''s documented output) or `failed` (read `error`). Poll every few seconds, or pass `wait: 30` to long-poll - the call is held up to 30 seconds (max 60) and returns as soon as the job finishes.'
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        description: The job id returned by a generation call (its `id` in the 202 response).
        required: true
        schema:
          type: string
      - name: wait
        in: query
        description: Seconds to long-poll for a terminal state (0-60). Defaults to 0 (return immediately).
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job for this API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get api job
      x-summary-source: derived
    delete:
      description: Cancel a queued job you started through the API or MCP; the credits held for it are refunded. Jobs that are already running cannot be canceled (409). Returns the canceled job. This is free (no credits). Requires an API key (user scope).
      tags:
      - Jobs
      operationId: cancelApiJob
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such job for this API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Job is not in a cancelable state (e.g. already running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Cancel api job
      x-summary-source: derived
  /jobs:
    get:
      summary: 'List the user''s active generation jobs (Roles: user)'
      tags:
      - Jobs
      operationId: listJobs
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: status
        in: query
        required: false
        description: Comma-separated statuses to include. Defaults to queued,running,failed.
        schema:
          type: string
      - name: includeAcknowledged
        in: query
        required: false
        description: Include jobs the user has dismissed. Defaults to false.
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
