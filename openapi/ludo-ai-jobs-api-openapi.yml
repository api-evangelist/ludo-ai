          type: string
    JobTestWaitPayload:
      type: object
      description: Payload for the load-test queue endpoint. The worker sleeps for a random duration in [min_ms, max_ms) instead of calling Prometheus.
      properties:
        min_ms:
          type: integer
          format: int32
          description: Minimum sleep in milliseconds. Defaults to 10000 (10s).
        max_ms:
          type: integer
          format: int32
          description: Maximum sleep in milliseconds (exclusive). Defaults to 120000 (2min).
        request_id:
          type: string
          description: Optional idempotency key, same semantics as the real queue endpoints.
    Animate3DPresetPayload:
      type: object
      required:
      - preset_id
      properties:
        request_id:
          type: string
        model_asset_id:
          type: string
          description: Parent 3D asset id the resulting clip belongs to.
        preset_id:
          type: string
          description: id of an animation preset (see /utils/animation-presets).
        generated_model:
          $ref: '#/components/schemas/ThreeDModelInput'
        user_model:
          type: string
          description: URL of an already-rigged GLB to retarget onto.
        user_model_file_type:
          type: string
        crop_loop:
          type: boolean
          description: Trim the animation to the span that loops seamlessly. Omit to follow the preset's own loop flag (cyclic motions loop, one-shots keep their full arc). Ignored when no clean loop exists in the motion.
        in_place:
          type: boolean
          description: Remove the animation's net travel so the character moves on the spot and the engine drives locomotion. Omit to follow crop_loop.
