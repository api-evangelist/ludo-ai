  /jobs/generate-upscale-video:
    post:
      summary: Enqueue a video-upscale (2x) job. Only for videos below 960x960 pixels.
      tags:
      - Jobs
      operationId: upscaleVideoQueued
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpscaleVideoPayload'
        required: true
  /jobs/test-wait:
    post:
      summary: Enqueue a no-op test job that sleeps for a random duration.
      tags:
      - Jobs
      operationId: testWaitQueued
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Test task type disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobTestWaitPayload'
        required: true
  /jobs/remove-image-background:
    post:
      summary: 'Enqueue a background-removal job (Roles: user)'
      tags:
      - Jobs
      operationId: removeImageBackgroundQueued
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueRemoveImageBackgroundPayload'
        required: true
  /jobs/upscale-image:
    post:
      summary: Enqueue an image upscale (up to 4x, capped at 2048px; the image must be below…
      tags:
      - Jobs
      operationId: upscaleImageQueued
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueUpscaleImagePayload'
        required: true
components:
  schemas:
    GenerateVideoPayload:
      type: object
