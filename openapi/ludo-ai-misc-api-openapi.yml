        voice_presets:
          $ref: '#/components/schemas/VoicePresetList'
        audio_limits:
          $ref: '#/components/schemas/AudioLimits'
    GDDPack:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/GDDPackComponent'
        description:
          type: string
        name:
          type: string
        title:
          type: string
    ModelDurationCost:
      type: object
      description: A valid duration for a model with its pre-computed credit cost.
      properties:
        duration:
          type: number
          format: float
        cost:
          type: number
          format: float
    ComponentInfo:
      type: object
