components:
  schemas:
    FlatRateCost:
      type: object
      description: Variable cost billed at a fixed per-second rate, independent of model.
      properties:
        feature_id:
          type: string
        description:
          type: string
        credits_per_second:
          type: number
          format: float
    GeneratedVideo:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        id:
          type: string
        original_prompt:
          type: string
        prompt:
          type: string
        url:
          type: string
        image:
          $ref: '#/components/schemas/GameImage'
        pil_image:
          $ref: '#/components/schemas/PILImage'
        seed:
          type: integer
          format: int64
        duration:
          type: number
          format: float
        has_audio:
          type: boolean
        model:
          type: string
          description: Codename of the model that generated the video, e.g. eagle. Absent on videos created before it was recorded.
        pixel_grid:
          type:
          - array
          - 'null'
          description: Pixel-art grid dimensions [width, height] detected/used by the generation, or null. Reported by pixel-art-aware models (forge-pixel); must always be persisted with the video.
          items:
            type: integer
            format: int32
        reference_url:
          type: string
          description: Motion clip the animation was driven by (motion transfer presets), as reported by the ML. Absent on videos saved before it was recorded.
        crop_and_center_image:
          type: boolean
        middle_image:
          $ref: '#/components/schemas/GameImage'
        final_image:
          $ref: '#/components/schemas/GameImage'
        margin_ratio:
          type: number
          format: float
        margin_ratio_horizontal:
          type: number
          format: float
        margin_ratio_vertical:
          type: number
          format: float
    UserRefreshPayload:
      type: object
      properties:
        login_payload:
          $ref: '#/components/schemas/LoginPayload'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        genres:
          type: array
          items:
            type: string
        generationStyles:
          type: array
          items:
            type: string
        generationStylesDetails:
          type: array
          items:
            $ref: '#/components/schemas/GeneratorOption'
        generationTypes:
          type: array
          items:
            type: string
        generationTypesStandalone:
          type: array
          items:
            $ref: '#/components/schemas/GeneratorOption'
        generationTypes3d:
          type: array
          items:
            type: string
        generationTypesSprite:
          type: array
          items:
            type: string
        generationTypesNoBg:
          type: array
          items:
            type: string
        componentGroups:
          type: array
          items:
            $ref: '#/components/schemas/ComponentGroup'
        componentList:
          type: array
          items:
            $ref: '#/components/schemas/ComponentInfo'
        gddPacks:
          type: array
          items:
            $ref: '#/components/schemas/GDDPack'
        colors:
          type: array
          items:
            $ref: '#/components/schemas/ColorFilter'
        styles:
          type: array
          items:
            type: string
        platforms:
          type: array
          items:
            type: string
        perspectives:
          type: array
          items:
            type: string
        perspectivesDetails:
          type: array
          items:
            $ref: '#/components/schemas/GeneratorOption'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        health:
          type: boolean
        credits:
          $ref: '#/components/schemas/GenerationCreditsInfo'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/PaymentPlan'
        documentation:
          type: array
          items:
            $ref: '#/components/schemas/Documentation'
        whats_new:
          type: array
          items:
            $ref: '#/components/schemas/WhatsNew'
        generation_steps:
