        _id:
          type: string
        user_id:
          type: string
        team_id:
          type: string
        name:
          type: string
        description:
          type: string
        date:
          type: integer
          format: int64
        date_updated:
          type: integer
          format: int64
        archived:
          type: boolean
        genres:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
        platforms:
          type: array
          items:
            type: string
        platform:
          type: string
        gdd2:
          $ref: '#/components/schemas/GDD'
        gdd3:
          $ref: '#/components/schemas/GDD3'
    GDDSectionValue:
      type: object
      properties:
        text:
          type: string
        country:
          type: string
        title:
          type: string
        layout:
          type: string
        imageType:
          type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/GameImage'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ThreeDAsset'
        games:
          type: array
          items:
            type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedText'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/GDDComment'
        score:
          $ref: '#/components/schemas/LudoScore'
    GDD3Version:
      type: object
      required:
      - project_id
      - version
      - timestamp
      - user_id
      - command
      properties:
        _id:
          type: string
        project_id:
          type: string
        version:
          type: integer
          format: int64
        timestamp:
          type: integer
          format: int64
        user_id:
          type: string
        command:
          type: string
          enum:
          - element:create
          - element:update
          - element:delete
          - element:reorder
          - title:update
          - summary:update
          - field:update
        element_id:
          type: string
        old_value:
          type: string
        new_value:
          type: string
        after_id:
          type: string
        undone:
          type: boolean
        description:
          type: string
    PricingModel:
      type: object
      description: Per-model pricing configuration with durations and pre-computed costs.
      properties:
        codename:
          type: string
          description: Canonical model identifier used by the API (e.g. "blitz").
        name:
          type: string
          description: User-facing display name (e.g. "Blitz").
        description:
          type: string
          description: Short free-form description. Optional; may be empty.
        aliases:
          type: array
          description: Legacy identifiers that resolve to this codename (e.g. "standard" → "blitz").
          items:
            type: string
        legacy:
          type: boolean
          description: True if this model is superseded and should be shown in a "legacy models" group in UIs.
        features:
          type: array
          description: Credit actions this model is available for (e.g. ["GENERATE_VIDEO", "ANIMATE_SPRITE"]).
          items:
            type: string
        credits_per_second:
          type: number
          format: float
        min_charge:
          type: number
          format: float
          description: Minimum credit charge regardless of duration. Null when not enforced.
        durations:
          type: array
          items:
            $ref: '#/components/schemas/ModelDurationCost'
    GeneratedGame:
