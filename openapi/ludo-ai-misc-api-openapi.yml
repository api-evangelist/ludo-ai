openapi: 3.2.0
info:
  version: 0.9.10
  title: Ludo.ai Misc API
servers:
- url: /api
tags:
- name: Misc
paths:
  /generation-history/{type}:
    get:
      summary: 'Get user''s generation history by type (Roles: user)'
      tags:
      - Misc
      operationId: getGenerationHistory
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: type
        in: path
        required: true
        description: Type of generation history to retrieve
        schema:
          type: string
      - name: pageSize
        in: query
        required: false
        description: 'Number of items per page (default: 20, max: 100)'
        schema:
          type: number
      - name: pageNumber
        in: query
        required: false
        description: 'Page number (1-based, default: 1)'
        schema:
          type: number
      - name: search
        in: query
        required: false
        description: Free-text search; whitespace-separated terms are AND-ed over tags, prompts, user inputs (hints), art style, perspective, and label
        schema:
          type: string
      - name: tags
        in: query
        required: false
        description: Labels picked deliberately (as opposed to typed). Each must match the item's tags EXACTLY, and they AND with each other and with `search`. Unlike `search`, this never matches prompts or other text, so picking a label narrows the list to the items actually carrying it. Values are normalized the same way stored tags are, so either "two-handed" or "Two Handed" works.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: outputsOnly
        in: query
        required: false
        description: When true, return only items that have a finished generated output for this type (drops image-only/intermediate items). Applied before pagination so number_pages reflects the filtered count. Combines with search as AND. No-op for types without outputs (audio, generated_image).
        schema:
          type: boolean
          default: false
      - name: dateFrom
        in: query
        required: false
        description: Inclusive lower bound (unix seconds) on the item's creation date. Combines with search/outputsOnly as AND; applied before pagination so number_pages reflects the filtered count.
        schema:
          type: number
      - name: dateTo
        in: query
        required: false
        description: Inclusive upper bound (unix seconds) on the item's creation date. Callers pass end-of-day to keep a single-day range inclusive.
        schema:
          type: number
      - name: source
        in: query
        required: false
        description: 'Which surface the items were generated from: web (default, studio generations only), api (public API/MCP generations only - these expire 7 days after creation unless kept), or all.'
        schema:
          type: string
          enum:
          - web
          - api
          - all
          default: web
      - name: renderedFrom
        in: query
        required: false
        description: 'Spritesheets and generated images only: the history id of a 3D model (three_d_asset), to list only the sheets or stills rendered from it (3D to sprite). Combines with the other filters as AND, before pagination. Ignored for other types.'
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationHistoryResults'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /generation-history/{type}/tags:
    get:
      summary: 'Get distinct tags (with counts) for a generation-history type (Roles: user)'
      tags:
