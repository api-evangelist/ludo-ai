                  type: string
        required: true
  /generation-history/keep:
    post:
      summary: 'Promote an API-generated history item to a permanent web asset (Roles: user)'
      description: 'API/MCP generations expire 7 days after creation (their files live under the api/ storage prefix, which is lifecycle-pruned). Keeping an item copies its files out of the api/ prefix, rewrites the stored URLs, and clears the api flag - after which it behaves exactly like a studio generation: permanent, visible in the default library view, and usable in projects.'
      tags:
      - Misc
      operationId: keepGenerationHistory
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationHistory'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: string
                  description: GenerationHistory id of the API-generated item to keep
        required: true
