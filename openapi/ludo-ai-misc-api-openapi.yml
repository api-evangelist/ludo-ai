            type: string
        languages:
          type: array
          items:
            type: string
        emotions:
          type: array
          items:
            type: string
        delivery:
          type: boolean
          description: Whether this voice model takes a delivery note.
        model:
          type: string
          description: The voice model these presets belong to, to send back with speech-preset generations. Unset means the default model.
    ImageTo3DCost:
      type: object
      description: 'Image-to-3D models offered in this environment. Each is a flat price per generation, billed as its own credit action (feature_id): its cost is that entry of features.'
      properties:
        feature_id:
          type: string
        default_model:
          type: string
        models:
          type: array
          items:
            $ref: '#/components/schemas/ImageTo3DCostModel'
    SpritePose:
      type: object
      properties:
        animation_prompt:
          type: string
          description: Animation description for the sprite pose
        margin_ratio:
          type: number
          format: float
          description: Margin ratio for the sprite animation
        margin_ratio_mode:
          type: string
        name:
          type: string
          description: Name of the sprite pose
        prompt:
          type: string
          description: Prompt description for the sprite pose
    GDDElement:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        sub_title:
          type: string
        text:
          type: string
        mod_date:
          type: integer
          format: int64
        media:
          type: array
