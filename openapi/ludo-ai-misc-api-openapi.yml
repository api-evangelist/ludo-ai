        platforms:
          type: array
          items:
            type: string
        sentence:
          type: string
        punchline:
          type: string
        art_style:
          type: string
        quality_score:
          type: number
          format: float
        uniqueness_score:
          type: number
          format: float
        final_score:
          type: number
          format: float
        hints:
          type: array
          items:
            type: string
        request_id:
          type: string
        prompt:
          type: string
        selected_genres:
          type: array
          items:
            type: string
        mechanics:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedText'
        step_choices:
