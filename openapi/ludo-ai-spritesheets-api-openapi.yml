      x-credit-description: 'This endpoint''s credit cost varies by model and duration (credits/s × seconds, rounded to 0.1; a model''s minimum charge applies when that product is lower). Available models: Hydra (3 credits/s, minimum charge 9 credits per generation; 3s = 9, 3.5s = 10.5, 4s = 12, 4.5s = 13.5, 5s = 15) · Forge (1.5 credits/s, minimum charge 4 credits per generation; 1s = 4, 1.5s = 4, 2s = 4, 2.5s = 4, 3s = 4.5, 3.5s = 5.3, 4s = 6, 4.5s = 6.8, 5s = 7.5) · Forge Pixel (1.5 credits/s, minimum charge 4 credits per generation; 1s = 4, 1.5s = 4, 2s = 4, 2.5s = 4, 3s = 4.5, 3.5s = 5.3, 4s = 6, 4.5s = 6.8, 5s = 7.5)'
