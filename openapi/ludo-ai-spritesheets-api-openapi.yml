openapi: 3.2.0
info:
  version: 0.9.10
  title: Ludo.ai Spritesheets API
servers:
- url: /api
tags:
- name: Spritesheets
paths:
  /assets/sprite/animate:
    post:
      summary: Animate a static sprite into a spritesheet driven by a motion text prompt…
      tags:
      - Spritesheets
      operationId: animateSprite
      x-credit-action: ANIMATE_SPRITE
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpriteResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimateSpritePayload'
        required: true
  /assets/sprite/animate-keyframes:
    post:
      summary: Animate a sprite through up to three fixed keyframes - initial_image…
      tags:
      - Spritesheets
      operationId: animateSpriteKeyframes
      x-credit-action: ANIMATE_SPRITE
      x-credit-models:
      - hydra
      - hydra-plus
      - forge
      - forge-pixel
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpriteResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimateSpriteKeyframesPayload'
        required: true
  /assets/sprite/pose:
    post:
      summary: Re-pose an existing sprite into a new target pose while preserving the…
      tags:
      - Spritesheets
      operationId: generatePose
      x-credit-action: GENERATE_IMAGE
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PoseResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePosePayload'
        required: true
  /assets/sprite/rotate:
    post:
      summary: Re-render an existing sprite from a different camera viewpoint while keeping…
      tags:
      - Spritesheets
      operationId: rotateSprite
      x-credit-action: GENERATE_IMAGE
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RotateSpriteResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSpritePayload'
        required: true
  /assets/sprite/transfer-motion:
    post:
      summary: Transfer motion from a reference video or a named animation preset onto a…
      tags:
      - Spritesheets
      operationId: transferMotion
      x-credit-action: TRANSFER_SPRITE_MOTION
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpriteResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferMotionPayload'
        required: true
  /assets/sprite/animation-presets:
    get:
      description: 'List the available animation presets along with their perspectives and the eight supported compass directions (N, NE, E, SE, S, SW, W, NW). Synchronous GET with no request body: it returns an animations array (each with id, name, category, description, duration, and preview_url), a deduplicated perspectives array, and the directions list. This is a free discovery endpoint and does not charge credits. Use it to obtain the preset_id, perspective, and direction values that transferMotion needs, and to find motion preset names you can reference when animating; pair it with transferMotion (to apply a preset onto a sprite), animateSprite (text-prompt animation), or animate3DModelPreset (apply any preset by id to a rigged 3D model). Requires an API key (user scope).'
      tags:
      - Spritesheets
      operationId: listAnimationPresets
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimationPresetsResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: List animation presets
      x-summary-source: derived
  /assets/sprite/edit:
    post:
      summary: 'Edit a previously generated spritesheet: re-prompt its underlying animation…'
      tags:
      - Spritesheets
      operationId: editSpritesheet
      x-credit-action: EDIT_SPRITESHEET
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpriteResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditSpritesheetPayloadPublic'
        required: true
  /assets/sprite/rotate-spritesheet:
    post:
      summary: 'Re-render a previously generated sprite animation from a new view: the same…'
      tags:
      - Spritesheets
      operationId: rotateSpritesheet
      x-cli-name: rotate-sheet
      x-credit-action: NEW_VIEW_SPRITESHEET
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpriteResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateSpritesheetPayload'
        required: true
  /assets/sprite/adjust:
    post:
      summary: 'Adjust Sprite Sheet: re-export a previously generated sprite animation with…'
      tags:
      - Spritesheets
      operationId: adjustSpritesheet
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpriteResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustSpritesheetPayload'
        required: true
  /assets/sprite/audio:
    post:
      summary: Generate a sound effect for a previously generated spritesheet animation.
      tags:
      - Spritesheets
      operationId: createSpriteAudio
      x-credit-action: GENERATE_AUDIO_FOR_SPRITES
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpriteAudioPayload'
        required: true
  /assets/sprite/directional-styles:
    get:
      description: 'List the styles Directional Sprites can render a 3D model in, with the perspectives (camera heights) and the eight directions they render from. Each style has an id (pass it as style_id), a label, a description, a family, whether it is pixel art, a thumbnail_url of the style at its defaults, its current version, and its settings: each setting has a name (the key in style_params), a kind (choice, bool or color - a color setting also takes any colour), its options ({label, value}) and its default. advanced_settings work the same way. Free discovery endpoint: it does not charge credits. Use it before previewDirectionalSprites, createDirectionalSprites and createDirectionalStills. Requires an API key (user scope).'
      tags:
      - Spritesheets
      operationId: listDirectionalSpriteStyles
      x-cli-name: directional-styles
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionalSpriteStylesResponse'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: List directional sprite styles
      x-summary-source: derived
  /assets/sprite/directional-preview:
    post:
      summary: 'Preview Directional Sprites: a few frames of a 3D model in a style, from each…'
      tags:
      - Spritesheets
      operationId: previewDirectionalSprites
      x-cli-name: directional-preview
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionalPreviewResult'
        '204':
          description: Cancelled by a newer preview of yours
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Previews temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectionalPreviewPayload'
        required: true
  /assets/sprite/directional:
    post:
      summary: 'Directional Sprites: render a 3D model into one spritesheet per direction, in a…'
      tags:
      - Spritesheets
      operationId: createDirectionalSprites
      x-cli-name: directional
      x-credit-action: RENDER_SPRITE_3D
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionalSpritesResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectionalSpritesPayload'
        required: true
  /assets/sprite/directional-stills:
    post:
      summary: 'Directional Sprites stills: render a 3D model as it is (no animation) into one…'
      tags:
      - Spritesheets
      operationId: createDirectionalStills
      x-cli-name: directional-stills
      x-credit-action: RENDER_SPRITE_3D_STILL
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionalStillsResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectionalStillsPayload'
        required: true
  /assets/sprites/results:
    get:
      description: '**Deprecated:** prefer `GET /assets/generations` (all types, paginated, same source filter). This endpoint continues to work; no removal is scheduled.

        List spritesheets you previously generated through the API, most recent first. This is a free read-only history lookup (no credits, no generation); it does not create anything. Pass an optional request_id query parameter to return only the results tagged with that id when you originally called animateSprite or transferMotion. Requires an API key (user scope).'
      tags:
      - Spritesheets
      operationId: getSpriteResults
      deprecated: true
      x-mcp-exclude: true
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      parameters:
      - name: request_id
        in: query
        description: Filter results by request_id
        required: false
        schema:
          type: string
      - name: source
        in: query
        description: 'Which surface the results were generated from: api (default, your API/MCP generations from the last 7 days), web (your Ludo web studio generations, no time limit), or all'
        required: false
        schema:
          type: string
          enum:
          - api
          - web
          - all
          default: api
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpriteResult'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get sprite results
      x-summary-source: derived
components:
  schemas:
    DirectionalSpriteRender:
      type: object
      properties:
        style_id:
          type: string
        style_version:
          type: integer
        style_params:
          type: object
          description: The style's settings as rendered, by name.
        perspective:
          type: string
        direction:
          type: string
        animation_name:
          type: string
        fps:
          type: number
          format: float
        keep_horizontal_travel:
          type: boolean
        keep_vertical_travel:
          type: boolean
    SpriteResult:
      type: object
      properties:
        spritesheet_url:
          type: string
        video_url:
          type: string
        audio_url:
          type: string
          description: URL of the sound effect generated for the animation (MP3 or WAV; the extension says which). hydra and hydra-plus only; absent for forge and forge-pixel.
        gif_url:
          type: string
        individual_frame_urls:
          type: array
          items:
            type: string
        num_frames:
          type: integer
          description: Number of frames in the spritesheet.
        num_cols:
          type: integer
          description: Columns in the frame grid. Frames run left-to-right, top-to-bottom.
        num_rows:
          type: integer
          description: Rows in the frame grid. The last row may be only partly filled.
        spritesheet_with_background_url:
          type: string
        individual_frame_with_background_urls:
          type: array
          items:
            type: string
        duration:
          type: number
          format: float
        request_id:
          type: string
        created_at:
          type: integer
    DirectionalPreviewPayload:
      type: object
      required:
      - model
      properties:
        model:
          type: string
          description: The 3D model, as a URL or base64-encoded GLB file (not an AI model name). Rigged, to animate it.
        animation_url:
          type: string
          description: An animation for the model, as a URL or base64-encoded GLB file - the glb_url of an animation from animate3DModel or animate3DModelPreset, made for this model's skeleton. At most one of animation_url, preset_id and model_animation.
        preset_id:
          type: string
          description: An animation preset id from listAnimationPresets, retargeted onto the model. Any rig type can take one; when the preset cannot be retargeted onto the model, the call returns an error. At most one of animation_url, preset_id and model_animation.
        crop_loop:
          type: boolean
          description: With preset_id, trim the preset to the span that loops seamlessly. Omit to follow the preset's own loop flag.
        model_animation:
          type: string
          description: The name of an animation the GLB itself carries. At most one of animation_url, preset_id and model_animation; with none, the preview is a single frame.
        perspective:
          type: string
          default: isometric
          description: Camera height, from the side (horizon) to straight down (top).
          enum:
          - horizon
          - low
          - isometric
          - high
          - top
        directions:
          type: array
          default:
          - SW
          minItems: 1
          maxItems: 8
          uniqueItems: true
          description: Where the camera stands around a character facing S, each direction at most once. One preview per direction, in this order.
          items:
            type: string
            enum:
            - S
            - SW
            - W
            - NW
            - N
            - NE
            - E
            - SE
        style_id:
          type: string
          default: render_3d
          description: A style id from listDirectionalSpriteStyles.
        style_version:
          type: integer
          description: Version of the style; omit for its current one.
        style_params:
          type: object
          description: The style's settings to change, by name, each one of its listed option values (true/false for a bool setting, or any colour for a color one). Omit a setting to keep its default.
        keep_horizontal_travel:
          type: boolean
          default: false
          description: Keep the animation's ground travel (the character moves across the frame). Off keeps it in place.
        keep_vertical_travel:
          type: boolean
          default: true
          description: Keep the animation's vertical root motion (jumps, bobbing).
        target_frame_size:
          type: integer
          minimum: 32
          maximum: 384
          default: 256
          description: Sprite size of the preview frames in pixels (the longer side).
    RotateSpritePayload:
      type: object
      description: Payload for rotating the camera view of an existing sprite
      required:
      - image
      - camera_rotation
      properties:
        image:
          type: string
          description: URL or base64-encoded source sprite image to rotate.
        camera_rotation:
          type: integer
          enum:
          - 0
          - 45
          - 90
          - 135
          - 180
          - -135
          - -90
          - -45
          description: Camera azimuth angle in degrees. 0 = front, 45 = front-right, 90 = right side, 135 = back-right, 180 = back, -135 = back-left, -90 = left side, -45 = front-left.
        camera_elevation:
          type: integer
          enum:
          - 0
          - 30
          - 60
          description: Optional camera elevation/tilt in degrees. 0 = eye-level, 30 = elevated, 60 = high-angle. Omit to keep the sprite's current elevation.
        n:
          type: number
          format: integer
          description: Number of variations to generate (1-4).
          minimum: 1
          maximum: 4
          default: 1
        augment_prompt:
          type: boolean
          default: true
          description: Rewrites your prompt behind the scenes into the form the model works best with. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively.
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    DirectionalStill:
      type: object
      properties:
        direction:
          type: string
          description: The direction this image is seen from.
        url:
          type: string
        width:
          type: integer
        height:
          type: integer
        render_3d:
          $ref: '#/components/schemas/DirectionalSpriteRender'
    DirectionalSpriteSheet:
      type: object
      properties:
        direction:
          type: string
          description: The direction this sheet is seen from.
        spritesheet_url:
          type: string
        video_url:
          type: string
        gif_url:
          type: string
        individual_frame_urls:
          type: array
          items:
            type: string
        num_frames:
          type: integer
          description: Number of frames in the spritesheet.
        num_cols:
          type: integer
          description: Columns in the frame grid. Frames run left-to-right, top-to-bottom.
        num_rows:
          type: integer
          description: Rows in the frame grid. The last row may be only partly filled.
        fps:
          type: number
          format: float
          description: The frame rate the sheet plays at.
        render_3d:
          $ref: '#/components/schemas/DirectionalSpriteRender'
    AnimationPresetsResponse:
      type: object
      properties:
        animations:
          type: array
          items:
            $ref: '#/components/schemas/AnimationPresetPublic'
        perspectives:
          type: array
          items:
            $ref: '#/components/schemas/AnimationPerspective'
        directions:
          type: array
          items:
            type: string
    RotateSpriteResult:
      type: object
      description: Result of a sprite camera rotation
      properties:
        url:
          type: string
          description: URL of the generated image
        camera_rotation:
          type: integer
          description: The camera azimuth angle that was applied
        camera_elevation:
          type: integer
          description: The camera elevation that was applied, if any
    DirectionalSpriteStylesResponse:
      type: object
      properties:
        styles:
          type: array
          items:
            $ref: '#/components/schemas/DirectionalSpriteStyle'
        perspectives:
          type: array
          items:
            type: string
        directions:
          type: array
          items:
            type: string
    EditSpritesheetPayloadPublic:
      type: object
      description: Payload for editing a previously generated spritesheet. edit_mode selects the operation - prompt-driven edit (default), outpaint, loop fixing, or improve (finer detail, on hydra spritesheets only).
      required:
      - spritesheet_url
      properties:
        spritesheet_url:
          type: string
          description: 'URL of a spritesheet you generated in the last 7 days (returned by animateSprite, transferMotion, or a previous edit as spritesheet_url). External URLs are not accepted. Edit the original animation rather than a previous edit''s result: every edit re-renders the whole animation, so colors and detail drift further with each pass. If an edit did not work, retry from the original instead of editing on top.'
        edit_mode:
          type: string
          description: Edit operation to perform. "improve" re-renders the animation with finer detail (the extra pass hydra-plus runs when it generates) and only takes a spritesheet generated with hydra; any other source returns HTTP 400, including an already improved spritesheet (or a loop fix or outpaint of one), which has that detail already.
          enum:
          - prompt
          - outpaint
          - fix_loop
          - improve
          default: prompt
        prompt:
          type: string
