openapi: 3.2.0
info:
  version: 0.9.10
  title: Ludo.ai Team API
servers:
- url: /api
tags:
- name: Team
paths:
  /teams:
    post:
      summary: 'Adds a team. (Roles: user)'
      tags:
      - Team
      operationId: addTeam
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Team'
        required: true
    get:
      summary: 'Gets a user''s teams. (Roles: user)'
      tags:
      - Team
      operationId: getTeams
      security:
      - Bearer: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{id}:
    patch:
      summary: 'Renames a team. Only the team owner can do this. (Roles: user)'
      tags:
      - Team
      operationId: updateTeam
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the team owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamPayload'
        required: true
  /teams/{id}/join:
    get:
      summary: 'Joins a team. (Roles: user)'
      tags:
      - Team
      operationId: joinTeam
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPayload'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{id}/invite/{email}:
    get:
      summary: 'Invite email to team. (Roles: user)'
      tags:
      - Team
      operationId: inviteToTeam
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: 'Remove invitation to team. (Roles: user)'
      tags:
      - Team
      operationId: removeInvite
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: email
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{id}/users:
    get:
      summary: 'Get team users. (Roles: user)'
      tags:
      - Team
      operationId: getTeamUsers
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamUserInfo'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{id}/users/{userId}:
    delete:
      summary: 'Remove team user. (Roles: user)'
      tags:
      - Team
      operationId: removeTeamUser
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{id}/shared:
    get:
      summary: 'Gets a team''s shared content. (Roles: user)'
      tags:
      - Team
      operationId: getSharedItems
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SharedItem'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /slack/share/{team}/{project}:
    post:
      summary: 'Shares a resource to slack (Roles: user)'
      tags:
      - Team
      operationId: shareToSlack
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: team
        in: path
        required: true
        schema:
          type: string
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePayload'
        required: true
  /slack/auth/url/{team}:
    get:
      summary: 'Gets the Slack auth url for the user (Roles: user)'
      tags:
      - Team
      operationId: getSlackAuthUrl
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: team
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringValue'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /slack/auth/code/{code}/team/{team}:
    get:
      summary: 'Completes the Slack authentication (Roles: user)'
      tags:
      - Team
      operationId: completeSlackAuth
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: team
        in: path
        required: true
        schema:
          type: string
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /slack/remove/{team}:
    get:
      summary: 'Removes the Slack authentication (Roles: user)'
      tags:
      - Team
      operationId: removeSlackAuth
      security:
      - Bearer: []
      x-security-scopes:
      - user
      parameters:
      - name: team
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SubscriptionStats:
      type: object
      properties:
        revenue_year:
          type: number
          format: float
        revenue_12months:
          type: number
          format: float
        revenue_total:
          type: number
          format: float
        plan_name:
          type: string
        plan_interval:
          type: string
        is_customer:
          type: boolean
        became_customer_date:
          type: integer
          format: int64
    PaymentPlanMetadata:
      type: object
      properties:
        projects:
          type: string
        description:
          type: string
        seats:
          type: string
        favorites:
          type: string
        team:
          type: string
        amount_text:
          type: string
        credits:
          type: string
        premium:
          type: string
        magic_link:
          type: string
        api:
          type: string
        queue_concurrency:
          type: string
        rate_limits:
          type: string
    GeneratedVideo:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        id:
          type: string
        original_prompt:
          type: string
        prompt:
          type: string
        url:
          type: string
        image:
          $ref: '#/components/schemas/GameImage'
        pil_image:
          $ref: '#/components/schemas/PILImage'
        seed:
          type: integer
          format: int64
        duration:
          type: number
          format: float
        has_audio:
          type: boolean
        model:
          type: string
          description: Codename of the model that generated the video, e.g. eagle. Absent on videos created before it was recorded.
        pixel_grid:
          type:
          - array
          - 'null'
          description: Pixel-art grid dimensions [width, height] detected/used by the generation, or null. Reported by pixel-art-aware models (forge-pixel); must always be persisted with the video.
          items:
            type: integer
            format: int32
        reference_url:
          type: string
          description: Motion clip the animation was driven by (motion transfer presets), as reported by the ML. Absent on videos saved before it was recorded.
        crop_and_center_image:
          type: boolean
        middle_image:
          $ref: '#/components/schemas/GameImage'
        final_image:
          $ref: '#/components/schemas/GameImage'
        margin_ratio:
          type: number
          format: float
        margin_ratio_horizontal:
          type: number
          format: float
        margin_ratio_vertical:
          type: number
          format: float
    VoicePreset:
      type: object
      properties:
        id:
          type: string
        language:
          type: string
        emotion:
          type: string
    PurchaseIp:
      type: object
      properties:
        ip:
          type: string
        date:
          type: integer
          format: int64
          description: Unix epoch seconds when this IP was captured at a purchase action
    Spritesheet:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        id:
          type: string
        audio_b64:
          type: string
        duration:
          type: number
          format: float
        billed_duration:
          type: number
          format: float
          description: 'Seconds the generation was billed for: the length of the video Prometheus generated, never more than the duration the user requested. `duration` is the sheet''s loop-trimmed length as Prometheus reports it and is usually shorter.'
        start_timestamp:
          type: number
          format: integer
        end_timestamp:
          type: number
          format: integer
        num_frames:
          type: number
          format: integer
        num_cols:
          type: number
          format: integer
          description: Columns in the frame grid. Absent on legacy sheets, which use a square grid of ceil(sqrt(num_frames)) per side.
        num_rows:
          type: number
          format: integer
          description: Rows in the frame grid. Absent on legacy sheets, which use a square grid of ceil(sqrt(num_frames)) per side.
        max_num_frames:
          type: number
          format: integer
        margin_ratio:
          type: number
          format: integer
        margin_ratio_horizontal:
          type: number
          format: float
        margin_ratio_vertical:
          type: number
          format: float
        margin_ratio_mode:
          type: string
        target_frame_size:
          type: number
          format: integer
        loop:
          type: boolean
        bad_loop:
          type: boolean
        out_of_frame:
          type: boolean
        crop:
          type: boolean
        original_prompt:
          type: string
        motion_prompt:
          type: string
        prompt:
          type: string
        seed:
          type: number
          format: integer
        sprite_sheet:
          $ref: '#/components/schemas/PILImage'
        sprite_sheet_b64:
          type: string
        sprite_sheet_raw_b64:
          type: string
        sprite_sheet_watermarked_b64:
          type: string
          description: URL of the watermarked variant of sprite_sheet_b64 (object key = clean key + "_wm"). Present only when generated by a free user; served IN PLACE of sprite_sheet_b64 to free viewers. sprite_sheet_b64 itself always stays the clean asset.
        sprite_sheet_raw_watermarked_b64:
          type: string
          description: Watermarked variant of sprite_sheet_raw_b64 (see sprite_sheet_watermarked_b64).
        watermarked:
          type: boolean
          readOnly: true
          description: Response-only. True when the served sprite_sheet_b64 is the watermarked variant (free viewer). Never persisted - stripped from inbound bodies.
        video:
          $ref: '#/components/schemas/GeneratedVideo'
        preview_video_b64:
          type: string
        first_frame_b64:
          type: string
        last_frame_b64:
          type: string
        image:
          $ref: '#/components/schemas/GameImage'
        middle_image:
          $ref: '#/components/schemas/GameImage'
        final_image:
          $ref: '#/components/schemas/GameImage'
        has_audio:
          type: boolean
        model:
          type: string
          description: Codename of the model that generated (or last re-rendered) the animation, e.g. blitz, forge, tango. Absent on sheets created before it was recorded.
        is_edited:
          type: boolean
          description: True when this spritesheet was produced by an edit (prompt, outpaint, or fix_loop) - the whole animation was re-rendered, so frames may drift from the original.
        generation_mode:
          type: string
          description: How the ML produced the animation, as reported by it (e.g. image, edit, motion_transfer). Absent on sheets saved before it was recorded.
        pixel_art_filter:
          type: string
          description: Pixel-art filter the ML applied, as reported by it. Absent on sheets saved before it was recorded.
        degraded:
          type: boolean
          description: 'Degraded flag as reported by the ML for this render. Absent when the ML did not report a boolean, and on sheets saved before it was recorded. Never null: swagger-tools ignores x-nullable, so a null here fails request validation.'
        label:
          type: string
        preview_scale:
          type: number
          format: float
        pack_alignment:
          $ref: '#/components/schemas/PackAlignment'
        render_3d:
          $ref: '#/components/schemas/Sprite3DRender'
          description: 'How a sheet rendered from a 3D model (generation_mode render_3d) was rendered: style, settings, view, animation and model. Absent on every other sheet.'
    SharePayload:
      type: object
      properties:
        text:
          $ref: '#/components/schemas/GeneratedText'
        generated_game:
          $ref: '#/components/schemas/GeneratedGame'
        image:
          $ref: '#/components/schemas/GameImage'
        game:
          $ref: '#/components/schemas/Game'
        gdd_pdf:
          type: string
        gdd:
          $ref: '#/components/schemas/GDD3'
    MarketingConsent:
      type: object
      properties:
        granted:
          type: boolean
        date:
          type: integer
          format: int64
        source:
          type: string
    SharedItem:
      type: object
      properties:
        _id:
          type: string
        date:
          type: integer
          format: int64
        team_id:
          type: string
        project_id:
          type: string
        user_id:
          type: string
        type:
          type: string
          enum:
          - game
          - image
          - generated_game
        game_id:
          type: string
        generated_game:
          $ref: '#/components/schemas/GeneratedGame'
        image:
          $ref: '#/components/schemas/GameImage'
    GameImage:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        id:
          type: string
        image_id:
          type: string
        url:
          type: string
        type:
          type: string
        final_score:
          type: number
          format: float
        nsfw_prob:
          type: number
          format: float
        similarity:
          type: number
          format: float
        width:
          type: integer
          format: int64
        height:
          type: integer
          format: int64
        game_id:
          type: string
        hosted_filename:
          type: string
        icon:
          type: boolean
        targetSize:
          type: integer
        seed:
          type: integer
        embedded:
          type: boolean
        analysed:
          type: boolean
        image:
          type: string
        image_type:
          type: string
        prompt:
          type: string
        motion_prompt:
          type: string
        request_id:
          type: string
        hints:
          type: array
          items:
            type: string
        selected_genres:
          type: array
          items:
            type: string
        selected_colors:
          type: array
          items:
            type: string
        selected_style:
          type: string
        selected_perspective:
          type: string
        is_safe:
          type: boolean
        platform:
          type: string
        loading:
          type: boolean
        original_hints:
          type: array
          items:
            type: string
        genres:
          type: array
          items:
            type: string
        edit_mask:
          type: string
        edit_mode:
          type: string
        camera_rotation:
          type: integer
          minimum: -180
          maximum: 180
        camera_elevation:
          type: integer
          minimum: -30
          maximum: 60
        edit_mask_pil_image:
          $ref: '#/components/schemas/PILImage'
        pil_image:
          $ref: '#/components/schemas/PILImage'
        nsfw:
          type: number
          format: float
        pose:
          $ref: '#/components/schemas/SpritePose'
        render_3d:
          $ref: '#/components/schemas/Sprite3DRender'
          description: 'How a still rendered from a 3D model (3D to sprite) was rendered: style, settings, view and model. Absent on every other image.'
    PILImage:
      type: object
      properties:
        format:
          type: string
        format_description:
          type: string
    SpritePose:
      type: object
      properties:
        animation_prompt:
          type: string
          description: Animation description for the sprite pose
        margin_ratio:
          type: number
          format: float
          description: Margin ratio for the sprite animation
        margin_ratio_mode:
          type: string
        name:
          type: string
          description: Name of the sprite pose
        prompt:
          type: string
          description: Prompt description for the sprite pose
    GDDElement:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        sub_title:
          type: string
        text:
          type: string
        mod_date:
          type: integer
          format: int64
        media:
          type: array
          items:
            $ref: '#/components/schemas/GDDMedia'
        loading:
          type: integer
          format: int64
        pending:
          type: boolean
        collapsed:
          type: boolean
        country:
          type: string
    Annotation:
      type: object
      properties:
        start:
          type: integer
          format: int64
        end:
          type: integer
          format: int64
        label:
          type: string
        text:
          type: string
        label_probs:
          type: object
          properties:
            feature:
              type: number
              format: float
            junk:
              type: number
              format: float
            mechanic:
              type: number
              format: float
            theme:
              type: number
              format: float
    GDDMedia:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - image
          - three_d_asset
          - video
          - spritesheet
          - game_id
          - audio
        uploaded:
          type: boolean
        image:
          $ref: '#/components/schemas/GameImage'
        three_d_asset:
          $ref: '#/components/schemas/ThreeDAsset'
        video:
          $ref: '#/components/schemas/GeneratedVideo'
        spritesheet:
          $ref: '#/components/schemas/Spritesheet'
        audio:
          $ref: '#/components/schemas/GeneratedAudio'
        placeholder:
          $ref: '#/components/schemas/GDDPlaceholder'
        game_id:
          type: string
        loading:
          type: boolean
    GeneratedAudio:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        id:
          type: string
        audio_b64:
          type: string
        original_prompt:
          type: string
        original_text:
          type: string
        prompt:
          type: string
        text:
          type: string
        sample_url:
          type: string
        seed:
          type: integer
          format: int64
        type:
          type: string
        loop:
          type: boolean
        duration:
          type: number
          format: float
        voice_preset:
          $ref: '#/components/schemas/VoicePreset'
        model:
          type: string
          description: Voice model of a speech-preset generation (blackbird when unset).
        delivery:
          type: string
          description: Delivery note the speech was generated with.
        image:
          $ref: '#/components/schemas/GameImage'
    Subscription:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        collection_method:
          type: string
        cancel_at_period_end:
          type: boolean
        canceled_at:
          type: integer
          format: int64
        cancel_at:
          type: integer
          format: int64
        created:
          type: integer
          format: int64
        current_period_end:
          type: integer
          format: int64
        current_period_start:
          type: integer
          format: int64
        customer:
          type: string
        days_until_due:
          type: integer
          format: int64
        ended_at:
          type: integer
          format: int64
        plan:
          $ref: '#/components/schemas/PaymentPlan'
        quantity:
          type: integer
          format: int64
        start_date:
          type: integer
          format: int64
        status:
          type: string
        tax_percent:
          type: integer
          format: int64
        trial_end:
          type: integer
          format: int64
        trial_start:
          type: integer
          format: int64
        billing_cycle_anchor:
          type: integer
          format: int64
        latest_invoice:
          type: string
        from_team:
          type: boolean
        pause_collection:
          $ref: '#/components/schemas/SubscriptionPauseCollection'
        resume_requires_payment:
          type: boolean
          description: Present (true) only while the subscription is paused and at least one billing cycle was skipped (voided) during the pause, meaning a resume will immediately charge the full plan price for a fresh cycle.
        ended_immediately:
          type: boolean
          description: 'Present (true) only on an unsubscribe response when the cancel landed after a new period started but before its renewal was charged: the subscription was ended at once and the renewal discarded, instead of running (and billing) until the end of that new period.'
        pause_started_at:
          type: integer
          format: int64
          description: 'When the current pause was REQUESTED. Stripe records only where a pause ends (pause_collection.resumes_at), so this is stamped into subscription metadata by pauseSubscription. Audit only: the ceiling and the mid-pause email are measured from pause_billing_from, and fall back to this only when that is absent. Absent on pauses that began before the extension feature shipped.'
        pause_billing_from:
          type: integer
          format: int64
          description: 'When collection actually stops, i.e. the current_period_end that was current at the moment of pausing, and the anchor the six-month extension ceiling and the mid-pause midpoint are measured from. Must be stamped at pause time: with pause_collection.behavior "void" Stripe keeps advancing the billing cycle through the pause, so current_period_end read later names a different period. Absent on pauses that began before the extension feature shipped, which are then capped from pause_started_at instead (stricter, by the length of the paid-through tail).'
        pause_extended_at:
          type: integer
          format: int64
          description: When the current pause was extended. Present at most once per pause; while it is present the Extend control must not be offered, because extendPause refuses a second extension.
        pause_can_extend:
          type: boolean
          description: 'Present (true) only when extendPause would accept at least one more month right now: the pause is running, has not been extended, is not scheduled to cancel, and one more month still fits under the six-month ceiling measured from pause_billing_from (or pause_started_at). Gate the Extend control on this rather than on pause_extended_at alone, which would invite a subscriber already at the ceiling to extend and then refuse them. Absent on pauses with no anchor, where the server cannot tell from Stripe alone.'
