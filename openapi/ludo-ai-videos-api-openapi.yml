openapi: 3.2.0
info:
  version: 0.9.10
  title: Ludo.ai Videos API
servers:
- url: /api
tags:
- name: Videos
paths:
  /assets/video:
    post:
      summary: Generate a short video clip from a source image and a motion text prompt…
      tags:
      - Videos
      operationId: createVideo
      x-credit-action: GENERATE_VIDEO
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateVideoPayloadPublic'
        required: true
  /assets/video/references:
    post:
      summary: Generate a video from 1-5 reference images and a text prompt…
      tags:
      - Videos
      operationId: createVideoFromReferences
      x-credit-action: REFERENCES_TO_VIDEO
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferencesToVideoPayloadPublic'
        required: true
  /assets/video/edit:
    post:
      summary: Edit a previously generated video with a text prompt and optional reference…
      tags:
      - Videos
      operationId: editVideo
      x-credit-action: VIDEO_EDIT
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditVideoPayloadPublic'
        required: true
  /assets/video/upscale:
    post:
      summary: Upscale a previously generated video to twice its resolution (2x).
      tags:
      - Videos
      operationId: upscaleVideo
      x-credit-action: UPSCALE_VIDEO
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoResult'
        '202':
          description: 'Accepted - the generation was queued; poll GET /assets/jobs/{id}. A synchronous (async: false) call still running after 15 minutes also receives this.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJob'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpscaleVideoPayloadPublic'
        required: true
  /assets/videos/results:
    get:
      description: '**Deprecated:** prefer `GET /assets/generations` (all types, paginated, same source filter). This endpoint continues to work; no removal is scheduled.

        List videos you previously generated through the API, most recent first. This is a free read-only history lookup (no credits, no generation); it does not create anything. Pass an optional request_id query parameter to return only the results tagged with that id when you originally called createVideo. Requires an API key (user scope).'
      tags:
      - Videos
      operationId: getVideoResults
      deprecated: true
      x-mcp-exclude: true
      security:
      - ApiKey: []
      x-security-scopes:
      - user
      parameters:
      - name: request_id
        in: query
        description: Filter results by request_id
        required: false
        schema:
          type: string
      - name: source
        in: query
        description: 'Which surface the results were generated from: api (default, your API/MCP generations from the last 7 days), web (your Ludo web studio generations, no time limit), or all'
        required: false
        schema:
          type: string
          enum:
          - api
          - web
          - all
          default: api
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VideoResult'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get video results
      x-summary-source: derived
components:
  schemas:
    EditVideoPayloadPublic:
      type: object
      description: Payload for editing a previously generated video with a text prompt and optional reference images.
      required:
      - prompt
      - video
      properties:
        video:
          type: string
          description: URL of a video you generated in the last 7 days (returned by createVideo, createVideoFromReferences, or a previous edit). External URLs are not accepted.
        prompt:
          type: string
          description: Edit instruction describing the desired change.
        images:
          type: array
          maxItems: 5
          items:
            type: string
          description: Optional reference images (up to 5), each a URL or base64, to guide the edit.
        duration:
          type: number
          format: float
          description: Output video length in seconds. Defaults to the source video's duration.
        model:
          type: string
          description: Video model to use. Griffin HD (720p, generates audio) is the current model; Eagle is legacy.
          enum:
          - griffin-hd
          - eagle
          default: griffin-hd
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    UpscaleVideoPayloadPublic:
      type: object
      description: Payload for upscaling a previously generated video to twice its resolution.
      required:
      - video
      properties:
        video:
          type: string
          description: URL of a video you generated in the last 7 days (returned by createVideo, createVideoFromReferences, or editVideo). External URLs are not accepted. Both dimensions must be under 960 pixels (griffin 480p output qualifies; griffin-hd 720p output does not, except square).
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    PublicJobError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        metadata:
          type: string
        error_payload:
          type: string
        intent:
          type: object
          description: Stripe intent details sent with 3D Secure (406) errors
          properties:
            id:
              type: string
            type:
              type: string
              enum:
              - payment
              - setup
            client_secret:
              type: string
    VideoResult:
      type: object
      properties:
        url:
          type: string
          description: URL to the generated video file
        duration:
          type: number
          format: float
          description: Duration of the video in seconds
        has_audio:
          type: boolean
        request_id:
          type: string
        created_at:
          type: integer
    GenerateVideoPayloadPublic:
      type: object
      description: Payload for generating a video from a source image and motion prompt
      required:
      - image
      - prompt
      properties:
        image:
          type: string
          description: URL or base64-encoded source image (the starting frame for the video)
          example: <url> OR data:image/png;base64,...
        prompt:
          type: string
          description: Text description of the motion or action for the video (e.g., "walking forward", "waving hand", "camera zoom in")
        augment_prompt:
          type: boolean
          default: true
          description: Rewrites your prompt behind the scenes into the form the model works best with. Leave it on (the default). Turning it off does not give you more control - it usually gives worse results. Do not disable it unless you really know what you are doing and have tested your prompts extensively.
        final_image:
          type: string
          description: URL or base64-encoded end frame image. When provided, the video will interpolate between the initial and final frames.
          example: <url> OR data:image/png;base64,...
        duration:
          type: number
          format: float
          default: 5
          description: 'Video duration in seconds. Available values depend on the model -

            the source of truth is MODEL_PRICING (credits.js), surfaced via

            /credits/costs; the public API docs list them per model

            (auto-generated).

            '
          example: 5
        model:
          type: string
          description: Video generation model to use. Griffin (480p) and Griffin HD (720p) are the current models and generate audio; Blitz and Eagle are legacy.
          enum:
          - griffin
          - griffin-hd
          - blitz
          - eagle
          - eagle-audio
          - standard
          default: griffin
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    ReferencesToVideoPayloadPublic:
      type: object
      description: Payload for generating a video from 1-5 reference images and a text prompt.
      required:
      - prompt
      - images
      properties:
        prompt:
          type: string
          description: Text description of the video to generate.
        images:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
          description: Reference images (1 to 5), each a URL or base64. The generated video borrows characters, objects, and style from them.
        duration:
          type: number
          format: float
          default: 5
          description: Video length in seconds.
        model:
          type: string
          description: Video model to use. Griffin (480p) and Griffin HD (720p) are the current models and generate audio; Eagle is legacy.
          enum:
          - griffin
          - griffin-hd
          - eagle
          - eagle-audio
          default: griffin
        aspect_ratio:
          type: string
          description: Output aspect ratio. "default" lets the model choose.
          enum:
          - default
          - ar_1_1
          - ar_16_9
          - ar_9_16
          - ar_4_3
          - ar_3_4
          - ar_21_9
          default: default
        request_id:
          type: string
          description: Optional client-provided identifier, unique per request. Re-sending the same request_id returns the existing job instead of generating again. Also usable as the request_id filter of listGenerations.
        async:
          type: boolean
          default: true
          description: 'Defaults to true: the call returns 202 immediately with a job id to poll with getApiJob. Set false for a synchronous response (deprecated but supported): the call then blocks until the result is ready.'
    PublicJob:
      type: object
      required:
      - id
      - task_type
      - status
      - created_at
      properties:
        id:
          type: string
        task_type:
          type: string
          description: 'The public operationId that created this job (e.g. createImage). Determines the shape of `result`: it is exactly the 200 response body documented for that operation.'
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - canceled
        request_id:
          type: string
        created_at:
          type: integer
          format: int64
          description: Unix ms
        finished_at:
          type: integer
          format: int64
        credits_charged:
          type: number
          format: float
          description: Credits this job cost you. Charged at enqueue; reported as 0 once a job fails or is canceled, since the charge is refunded.
        result:
          type: object
          description: Present only when status is succeeded. Same shape as the synchronous response of the operation named by task_type.
        error:
          $ref: '#/components/schemas/PublicJobError'
        poll_after_ms:
          type: integer
          format: int32
          description: 'Present while the job is queued or running: wait at least this many milliseconds before polling again. Prefer GET /assets/jobs/{id}?wait=30 (long-poll) over tight loops.'
  securitySchemes:
    ApiKey:
      type: apiKey
      name: Authorization
      in: header
      description: 'For accessing the API a valid API Key token must be passed in all the queries in

        the ''Authorization'' header.

        The following syntax must be used in the ''Authorization'' header: ApiKey xxxxxx.yyyyyyy.zzzzzz

        '
    Bearer:
      type: apiKey
      name: Authorization
      in: header
      description: 'For accessing the API a valid JWT token must be passed in all the queries in

        the ''Authorization'' header.

        A valid JWT token is generated by the API and retourned as answer of a call

        to the route /login giving a valid user & password.

        The following syntax must be used in the ''Authorization'' header: Bearer xxxxxx.yyyyyyy.zzzzzz

        '
