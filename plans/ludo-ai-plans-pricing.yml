reconciled: true
tags:
- Artificial Intelligence
- Asset Generation
- Game Development
- Generative AI
description: 'Ludo.ai prices by credit-based subscription: Indie, Pro and Studio, billed monthly or annually
  (annual grants the whole year of credits upfront and saves up to 30%), plus Enterprise by contract.
  Credits pay for generation; unused credits roll over while the subscription is active. API, MCP and
  CLI access start at Pro, and those calls always use credits. Top-ups are available on every paid plan.'
