# Corrected 2026-09-29 against the live pricing page and the public plans endpoint it reads
# (https://api.ludo.ai/api/payment/plans). The 2026-05-04 bulk-sweep values it replaces
# had Pro at $47/month, Studio at $300/month and Pro at 1 concurrent request.
specification: API Commons Plans
